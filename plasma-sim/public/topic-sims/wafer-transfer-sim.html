const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let RUNNING=false;
function moveTo(k){
  const r=R(), i=sts().findIndex(s=>s.k===k);
  if(i<0){ fail('SEQ-001','현재 로봇으로 갈 수 없는 스테이션: '+k,'robot'); return false; }
  if(extended(r)){ fail('ALM-201','전진 상태에서 이동 명령 — 먼저 Retract 하세요.','robot'); return false; }
  if(!guard('rot'))return false;
  r.si=i; let t=sts()[i].ang; while(t-r.a>180)t-=360; while(t-r.a<-180)t+=360;
  r.at=t+(S.fault.enc?(S.fault.encDev||0):0);
  dropIfSlipping();
  log('I','MOVE','스테이션 이동 → '+sts()[i].n); return true;
}
function execCmd(line){
  const [c,arg]=[line.split(' ')[0],line.split(' ').slice(1).join(' ')];
  switch(c){
    case 'INIT':return A.init(); case 'HOME':return A.home();
    case 'SELECT':S.who=arg;log('I','SEL','제어 대상 '+arg);return true;
    case 'DOCK':return S.lp.docked?true:A.dock();
    case 'DOOR':return S.lp.door?true:A.door();
    case 'MAP':return A.map();
    case 'SLOT':{const r=R();if(!guard('z'))return false;r.z=+arg;log('I','ZAXIS','Slot '+arg+' 선택');return true;}
    case 'MOVE':return moveTo(arg);
    case 'EXTEND':return A.ext(); case 'RETRACT':return A.ret();
    case 'PICK':return A.pick(); case 'PLACE':return A.place(); case 'ALIGN':return A.align();
    case 'ATM':return A.atmV(); case 'TM':return A.tmV();
    case 'PUMP':return A.pump(); case 'VENT':return A.vent();
    case 'WAIT':return true;
    case 'CHECK':{
      const m={wafer:()=>!!R().wafer,vacuum:()=>S.ll.p<1,door:()=>S.lp.door}[arg];
      if(m&&m()){log('S','CHECK','조건 만족 : '+arg);return true;}
      fail('SEQ-002','SENSOR CHECK 실패 : '+arg+' 조건 불만족으로 시퀀스 정지','robot');return false;}
  }
  return true;
}
async function settle(line){
  const c=line.split(' ')[0];
  if(c==='WAIT'){await sleep((+line.split(' ')[1]||1)*1000);return;}
  const t0=Date.now();
  while(Date.now()-t0<12000){
    if(!RUNNING)return;
    const b=busy(R())||S.al.aligning||S.ll.pump||S.ll.vent;
    if(!b)break; await sleep(60);
  }
  await sleep(150);
}
async function runSeq(){
  if(RUNNING)return; if(!SEQ.length){toast('시퀀스가 비어 있습니다',false);return;}
  RUNNING=true; SEQ.forEach(s=>s.st=''); log('I','SEQ','자동 시퀀스 실행 시작 ('+SEQ.length+' 스텝)');
  for(let i=0;i<SEQ.length;i++){
    if(!RUNNING)break;
    SEQ.forEach((s,j)=>s.st=j<i?s.st:''); SEQ[i].st='cur'; renderSeq();
    const good=execCmd(SEQ[i].c);
    if(!good){SEQ[i].st='err';renderSeq();RUNNING=false;log('E','SEQ','시퀀스 중단 — '+(i+1)+'번 블록에서 오류');toast('시퀀스 중단: '+SEQ[i].c,false);return;}
    await settle(SEQ[i].c);
    SEQ[i].st='ok'; renderSeq();
  }
  if(RUNNING){C.seq++;log('S','SEQ','시퀀스 정상 완료');ok('시퀀스 완료');}
  RUNNING=false;
}
const SAMPLE=['INIT','HOME','DOCK','DOOR OPEN','MAP','MOVE foup','SLOT 1','EXTEND','PICK','RETRACT',
  'MOVE aligner','EXTEND','PLACE','RETRACT','ALIGN','EXTEND','PICK','RETRACT',
  'ATM VALVE','MOVE ll','EXTEND','PLACE','RETRACT','ATM VALVE','PUMP','CHECK vacuum'];


/* =========================================================================
   4-B. 로봇 프로그래밍 (RPL · Robot Program Language)
        JSON 으로 이송 프로그램을 짜고 · 검증하고 · 한 줄씩 돌려보고 · 채점받는다.
        실행 프리미티브는 시퀀스 탭과 같은 execCmd 를 쓴다 (동작 일관성).
   ========================================================================= */

/* ── 4-B-1. 프로그램에서 읽을 수 있는 장비 상태 함수 ───────────────── */
const PFN={
  wafer   :()=>R().wafer?1:0,                 // 현재 로봇 핸드에 웨이퍼가 있나
  pressure:()=>S.ll.p,                        // Load Lock 압력 (Torr)
  vacuum  :()=>S.ll.p<1?1:0,                  // 진공 도달 여부
  door    :()=>S.lp.door?1:0,
  docked  :()=>S.lp.docked?1:0,
  mapped  :()=>S.lp.mapped?1:0,
  slot    :()=>R().z,                         // 현재 Z (FOUP 에서는 슬롯 번호)
  homed   :()=>R().homed?1:0,
  inited  :()=>R().init?1:0,
  extended:()=>extended(R())?1:0,
  station :()=>cur().k,                       // 'foup' | 'aligner' | 'll' | 'pm1' | 'pm2'
  robot   :()=>S.who,                         // 'efem' | 'vac'
  atmValve:()=>S.ll.atmV?1:0,
  tmValve :()=>S.ll.tmV?1:0,
  llWafer :()=>S.ll.wafer?1:0,
  alWafer :()=>S.al.wafer?1:0,
  pmWafer :n=>S[Math.round(n)===2?'pm2':'pm1'].wafer?1:0,
  pmBusy  :n=>S[Math.round(n)===2?'pm2':'pm1'].run?1:0,          // 공정 중
  pmDone  :n=>{ const k=Math.round(n)===2?'pm2':'pm1';
                return (!S[k].run && S[k].wafer)?1:0; },          // 반출 대기
  pmLeft  :n=>pmLeft(Math.round(n)===2?'pm2':'pm1'),              // 남은 초
  pmTime  :n=>PMT[Math.round(n)===2?'pm2':'pm1'],                 // 공정 시간
  processed:()=>S.foup.filter(x=>x.wafer&&x.wafer.proc).length,   // 처리 끝나 FOUP 에 돌아온 장수
  alarms  :()=>C.alarm,
  slotHas :n=>{ const i=Math.round(n)-1; return (S.lp.mapped&&S.lp.map[i])?1:0; },
  foupHas :n=>{ const s=S.foup[Math.round(n)-1]; return (s&&s.wafer)?1:0; },
  abs     :n=>Math.abs(n), min:(a,b)=>Math.min(a,b), max:(a,b)=>Math.max(a,b)
};
/* Object.prototype 을 상속하지 않는 표로 옮긴다 —
   그대로 두면 constructor · toString 같은 이름이 함수로 잡힌다. */
const PFNT=Object.create(null);
Object.keys(PFN).forEach(k=>{ PFNT[k]=PFN[k]; });

/* ── 4-B-2. 식 계산기 — eval 없이 직접 파싱한다 ─────────────────────
   숫자 · 문자열 · $변수 · 함수호출 · 비교/논리/사칙 연산만 허용.        */
function pTokenize(src){
  const t=[], re=/\s*(?:(\d+(?:\.\d+)?)|'([^']*)'|"([^"]*)"|(\$[A-Za-z_]\w*)|([A-Za-z_]\w*)|(&&|\|\||==|!=|<=|>=|[-+*/%<>!(),]))/y;
  let m, i=0;
  while(i<src.length){
    re.lastIndex=i; m=re.exec(src);
    if(!m){ if(!src.slice(i).trim())break; throw new Error('식에서 알 수 없는 문자: '+src.slice(i,i+12)); }
    i=re.lastIndex;
    if(m[1]!==undefined)      t.push({t:'num', v:+m[1]});
    else if(m[2]!==undefined) t.push({t:'str', v:m[2]});
    else if(m[3]!==undefined) t.push({t:'str', v:m[3]});
    else if(m[4]!==undefined) t.push({t:'var', v:m[4].slice(1)});
    else if(m[5]!==undefined) t.push({t:'id',  v:m[5]});
    else                      t.push({t:'op',  v:m[6]});
  }
  return t;
}
function pEval(src, vars){
  if(typeof src==='number') return src;
  const t=pTokenize(String(src)); let p=0;
  const peek=()=>t[p], eat=v=>{ if(t[p]&&t[p].t==='op'&&t[p].v===v){p++;return true;} return false; };
  const num=x=>typeof x==='number'?x:(x?1:0);

  function primary(){
    const k=t[p];
    if(!k) throw new Error('식이 중간에 끝났습니다');
    if(eat('(')){ const v=expr(); if(!eat(')')) throw new Error('닫는 괄호가 없습니다'); return v; }
    if(eat('-')) return -num(primary());
    if(eat('!')) return num(primary())?0:1;
    if(k.t==='num'||k.t==='str'){ p++; return k.v; }
    if(k.t==='var'){ p++;
      if(!(k.v in vars)) throw new Error('선언되지 않은 변수: $'+k.v);
      return vars[k.v]; }
    if(k.t==='id'){ p++;
      const fn=PFNT[k.v];
      if(typeof fn!=='function') throw new Error('알 수 없는 함수: '+k.v+'()');
      const args=[];
      if(eat('(')){ if(!eat(')')){ do{ args.push(expr()); }while(eat(',')); if(!eat(')')) throw new Error(k.v+'() 의 닫는 괄호가 없습니다'); } }
      return fn.apply(null,args); }
    throw new Error('식을 이해할 수 없습니다: '+k.v);
  }
  const mul=()=>{ let v=primary();
    for(;;){ if(eat('*'))v=num(v)*num(primary()); else if(eat('/'))v=num(v)/num(primary());
             else if(eat('%'))v=num(v)%num(primary()); else return v; } };
  const add=()=>{ let v=mul();
    for(;;){ if(eat('+')){ const r=mul(); v=(typeof v==='string'||typeof r==='string')?String(v)+String(r):v+r; }
             else if(eat('-'))v=num(v)-num(mul()); else return v; } };
  const cmp=()=>{ let v=add();
    for(;;){ if(eat('=='))v=(v==add())?1:0; else if(eat('!='))v=(v!=add())?1:0;
             else if(eat('<='))v=(num(v)<=num(add()))?1:0; else if(eat('>='))v=(num(v)>=num(add()))?1:0;
             else if(eat('<'))v=(num(v)<num(add()))?1:0;  else if(eat('>'))v=(num(v)>num(add()))?1:0;
             else return v; } };
  const and=()=>{ let v=cmp(); while(eat('&&')){ const r=cmp(); v=(num(v)&&num(r))?1:0; } return v; };
  function expr(){ let v=and(); while(eat('||')){ const r=and(); v=(num(v)||num(r))?1:0; } return v; }

  const out=expr();
  if(p<t.length) throw new Error('식 뒤에 남은 내용이 있습니다: '+t[p].v);
  return out;
}
/* 인자 안의 $변수 치환 — "MOVE foup" 같은 문자열 인자용 */
function pArg(a, vars){
  if(a===undefined||a===null) return '';
  if(typeof a==='number') return String(a);
  return String(a).replace(/\$([A-Za-z_]\w*)/g, (_,n)=>{
    if(!(n in vars)) throw new Error('선언되지 않은 변수: $'+n);
    return vars[n];
  });
}

/* ── 4-B-3. 프로그램 검증 — 실행 전에 구조를 본다 ──────────────────── */
const P_ACTION=['INIT','HOME','SELECT','DOCK','UNDOCK','DOOR','MAP','SLOT','MOVE','EXTEND','RETRACT',
                'PICK','PLACE','ALIGN','VALVE','PUMP','VENT','WAIT','CHECK','LOG'];
const P_BLOCK =['REPEAT','WHILE','IF','SET','BREAK'];
const P_STATION=['foup','aligner','ll','pm1','pm2'];

function pValidate(prog){
  const errs=[];
  if(!prog||typeof prog!=='object'||Array.isArray(prog)) { errs.push(['(root)','프로그램은 { } 객체여야 합니다']); return errs; }
  if(!Array.isArray(prog.body)) errs.push(['(root)','body 는 배열이어야 합니다']);
  if(prog.vars!==undefined&&(typeof prog.vars!=='object'||Array.isArray(prog.vars)))
    errs.push(['vars','vars 는 { 이름: 값 } 객체여야 합니다']);
  const declared=Object.keys(prog.vars||{});

  (function walk(list, path){
    if(!Array.isArray(list)) return;
    list.forEach((n,i)=>{
      const at=path+'['+i+']';
      if(!n||typeof n!=='object'||Array.isArray(n)){ errs.push([at,'각 스텝은 { "op": ... } 객체여야 합니다']); return; }
      const op=n.op;
      if(typeof op!=='string'){ errs.push([at,'op 이 없습니다']); return; }
      if(!P_ACTION.includes(op)&&!P_BLOCK.includes(op)){ errs.push([at,'알 수 없는 명령: '+op]); return; }
      if(op==='MOVE'){
        const v=String(n.arg==null?'':n.arg);
        if(!v.startsWith('$')&&!P_STATION.includes(v)) errs.push([at,'MOVE 대상이 아닙니다: '+v+' (foup·aligner·ll·pm1·pm2)']);
      }
      if(op==='SELECT'&&!['efem','vac','$'].some(x=>String(n.arg||'').startsWith(x)))
        errs.push([at,'SELECT 은 efem 또는 vac 입니다']);
      if(op==='SET'){
        if(typeof n.var!=='string') errs.push([at,'SET 에는 var 이름이 필요합니다']);
        else if(!declared.includes(n.var)) declared.push(n.var);
        if(n.value===undefined) errs.push([at,'SET 에는 value 가 필요합니다']);
      }
      if(op==='REPEAT'){
        if(n.count===undefined) errs.push([at,'REPEAT 에는 count 가 필요합니다']);
        if(!Array.isArray(n.body)) errs.push([at,'REPEAT 에는 body 배열이 필요합니다']);
        walk(n.body, at+'.body');
      }
      if(op==='WHILE'){
        if(n.cond===undefined) errs.push([at,'WHILE 에는 cond 가 필요합니다']);
        if(!Array.isArray(n.body)) errs.push([at,'WHILE 에는 body 배열이 필요합니다']);
        walk(n.body, at+'.body');
      }
      if(op==='IF'){
        if(n.cond===undefined) errs.push([at,'IF 에는 cond 가 필요합니다']);
        if(!Array.isArray(n.then)) errs.push([at,'IF 에는 then 배열이 필요합니다']);
        walk(n.then, at+'.then');
        if(n.else!==undefined){
          if(!Array.isArray(n.else)) errs.push([at,'IF 의 else 는 배열이어야 합니다']);
          else walk(n.else, at+'.else');
        }
      }
      /* 식 문법은 실행 전에 미리 파싱해 본다 (상태 함수는 호출되지만 부작용이 없다) */
      ['cond','count'].forEach(f=>{
        if(n[f]!==undefined && typeof n[f]!=='number'){
          try{ pTokenize(String(n[f])); }catch(e){ errs.push([at,f+' 식 오류 — '+e.message]); }
        }
      });
      if(op==='SET'&&typeof n.value!=='number'){
        try{ pTokenize(String(n.value)); }catch(e){ errs.push([at,'value 식 오류 — '+e.message]); }
      }
    });
  })(prog.body, 'body');
  return errs;
}

/* ── 4-B-4. 실행기 — 재귀 인터프리터 + 한 줄 실행(스텝) 지원 ───────── */
let PROG = null;            // 파싱된 프로그램
let PSRC = '';              // 편집 중인 JSON 원문
let PST  = { run:false, step:false, paused:false, cur:'', err:'', done:{}, steps:0, t0:0, vars:{}, gate:null, depth:0 };

const pIsRun=()=>PST.run;
function pStop(msg){
  if(!PST.run) return;
  PST.run=false; PST.step=false; PST.paused=false;
  if(PST.gate){ const g=PST.gate; PST.gate=null; g(); }
  if(msg) log('W','PROG',msg);
}
/* 스텝 모드에서 다음 한 줄을 기다린다 */
function pGate(){
  if(!PST.step) return Promise.resolve();
  PST.paused=true; renderProgTree();
  return new Promise(res=>{ PST.gate=()=>{ PST.paused=false; PST.gate=null; res(); }; });
}
class PBreak{}

/* 프리미티브 실행 — execCmd 를 쓰되, 인자가 필요한 개폐형만 여기서 정확히 다룬다 */
function pPrimitive(op, arg){
  switch(op){
    case 'DOOR':
      if(String(arg).toUpperCase()==='CLOSE') return S.lp.door ? A.door() : true;
      return S.lp.door ? true : A.door();
    case 'UNDOCK':
      return S.lp.docked ? A.dock() : true;
    case 'VALVE':{
      const [side,act]=String(arg).trim().toUpperCase().split(/\s+/);
      if(side!=='ATM'&&side!=='TM'){ fail('PRG-004','VALVE 대상은 ATM 또는 TM 입니다.','ll'); return false; }
      const open = side==='ATM' ? S.ll.atmV : S.ll.tmV;
      const fn   = side==='ATM' ? A.atmV    : A.tmV;
      if(act==='CLOSE') return open ? fn() : true;
      return open ? true : fn();
    }
    case 'LOG': log('I','PROG', String(arg)); return true;
    default: return execCmd(arg===''||arg===undefined ? op : op+' '+arg);
  }
}
/* 동작이 끝날 때까지 기다린다 (시퀀스 탭 settle 과 같은 규칙) */
async function pSettle(op, arg){
  if(op==='WAIT'){ const s=parseFloat(arg)||1; const t0=Date.now();
    while(Date.now()-t0<s*1000){ if(!PST.run)return; await sleep(50); } return; }
  const t0=Date.now();
  while(Date.now()-t0<15000){
    if(!PST.run) return;
    if(!(busy(R())||S.al.aligning||S.ll.pump||S.ll.vent)) break;
    await sleep(60);
  }
  await sleep(90);
}

async function pRunList(list, path){
  for(let i=0;i<list.length;i++){
    if(!PST.run) return;
    const n=list[i], at=path+'['+i+']';
    PST.cur=at; renderProgTree();
    await pGate();
    if(!PST.run) return;

    try{
      if(n.op==='SET'){
        PST.vars[n.var]=pEval(n.value, PST.vars);
        log('I','PROG','$'+n.var+' = '+PST.vars[n.var]);
        PST.done[at]='ok'; PST.steps++; continue;
      }
      if(n.op==='BREAK'){ PST.done[at]='ok'; PST.steps++; throw new PBreak(); }
      if(n.op==='REPEAT'){
        const c=Math.floor(pEval(n.count, PST.vars));
        if(!(c>=0)||c>500) throw new Error('REPEAT 횟수가 올바르지 않습니다: '+c+' (0~500)');
        PST.done[at]='cur';
        try{ for(let k=0;k<c;k++){ if(!PST.run)return; PST.vars.__i=k+1; await pRunList(n.body, at+'.body'); } }
        catch(e){ if(!(e instanceof PBreak)) throw e; }
        PST.done[at]='ok'; PST.steps++; continue;
      }
      if(n.op==='WHILE'){
        PST.done[at]='cur';
        let guardN=0;
        try{
          while(pEval(n.cond, PST.vars)){
            if(!PST.run) return;
            if(++guardN>500) throw new Error('WHILE 이 500회를 넘었습니다 — 조건이 끝나지 않습니다');
            await pRunList(n.body, at+'.body');
          }
        }catch(e){ if(!(e instanceof PBreak)) throw e; }
        PST.done[at]='ok'; PST.steps++; continue;
      }
      if(n.op==='IF'){
        PST.done[at]='cur';
        const br = pEval(n.cond, PST.vars) ? n.then : (n.else||[]);
        await pRunList(br, at+(pEval(n.cond,PST.vars)?'.then':'.else'));
        PST.done[at]='ok'; PST.steps++; continue;
      }
      /* 나머지는 장비 동작 */
      const arg=pArg(n.arg, PST.vars);
      const good=pPrimitive(n.op, arg);
      PST.steps++; OPS++;
      if(!good){
        PST.done[at]='err'; PST.err=at+' · '+n.op+(arg?' '+arg:'')+' 에서 장비가 명령을 거부했습니다. 알람 로그를 보세요.';
        log('E','PROG','프로그램 중단 — '+at+' · '+n.op+(arg?' '+arg:''));
        toast('프로그램 중단: '+n.op+(arg?' '+arg:''), false);
        pStop(); renderProgTree(); return;
      }
      await pSettle(n.op, arg);
      PST.done[at]='ok';
    }catch(e){
      if(e instanceof PBreak) throw e;
      PST.done[at]='err';
      PST.err=at+' · '+e.message;
      log('E','PROG','프로그램 오류 — '+at+' · '+e.message);
      toast('프로그램 오류: '+e.message, false);
      pStop(); renderProgTree(); return;
    }
    renderProgTree();
  }
}

async function pRun(stepMode){
  if(PST.run) return;
  let prog;
  try{ prog=JSON.parse(PSRC); }
  catch(e){ PST.err='JSON 문법 오류 — '+e.message; renderPane(); toast('JSON 문법 오류',false); return; }
  const errs=pValidate(prog);
  if(errs.length){ PROG=prog; PST.err=''; renderPane(); toast(errs.length+'건의 오류를 먼저 고치세요',false); return; }

  PROG=prog;
  PST={ run:true, step:!!stepMode, paused:false, cur:'', err:'', done:{}, steps:0,
        t0:Date.now(), vars:Object.assign({}, prog.vars||{}), gate:null, depth:0 };
  const a0=C.alarm;
  log('I','PROG','프로그램 실행 — '+(prog.name||'이름 없음')+(stepMode?' (한 줄씩)':''));
  try{ await pRunList(prog.body, 'body'); }
  catch(e){ if(!(e instanceof PBreak)) log('E','PROG','실행 중단 — '+e.message); }

  if(PST.run){
    PST.run=false;
    const sec=((Date.now()-PST.t0)/1000);
    C.prog=(C.prog||0)+1;
    log('S','PROG','프로그램 정상 완료 — '+PST.steps+' 스텝 · '+sec.toFixed(1)+'초 · 알람 '+(C.alarm-a0)+'건');
    ok('프로그램 완료 ('+sec.toFixed(1)+'초)');
    pScore(sec, PST.steps, C.alarm-a0);
  }
  PST.cur=''; renderPane(); renderStatus(); renderMissions();
}

/* ── 4-B-5. 과제 채점 ──────────────────────────────────────────────── */
const PBEST_KEY='wt-prog-best';
function pBestLoad(){ try{ return JSON.parse(localStorage.getItem(PBEST_KEY)||'{}'); }catch(e){ return {}; } }
function pBestSave(o){ try{ localStorage.setItem(PBEST_KEY, JSON.stringify(o)); }catch(e){} }
let PTASK=null;                 // 지금 도전 중인 과제 id
const pTask=()=>(PROGT[WEEK[WK].n]||[]).find(t=>t.id===PTASK)||null;
let PRESULT='';                 // 마지막 채점 결과 문구

function pScore(sec, steps, alarms){
  const task=pTask();
  if(!task){ PRESULT=''; return; }
  let okGoal=false;
  try{ okGoal=!!task.goal(); }catch(e){ okGoal=false; }
  const viol=[];
  if(!okGoal) viol.push('목표 상태에 도달하지 못했습니다');
  if(task.maxSteps&&steps>task.maxSteps) viol.push('스텝 '+steps+'회 (제한 '+task.maxSteps+')');
  if(task.maxAlarm!==undefined&&alarms>task.maxAlarm) viol.push('알람 '+alarms+'건 (허용 '+task.maxAlarm+')');
  if(task.maxSec&&sec>task.maxSec) viol.push('시간 '+sec.toFixed(1)+'초 (제한 '+task.maxSec+'초)');

  if(viol.length){ PRESULT='✗ 미달 — '+viol.join(' · '); log('W','PROG','과제 미달 : '+viol.join(' · ')); return; }

  const rec = task.record==='steps' ? steps : +sec.toFixed(1);
  const b=pBestLoad(); const prev=b[task.id];
  let extra='';
  if(prev===undefined||rec<prev){ b[task.id]=rec; pBestSave(b); extra=' · 신기록!'; }
  else extra=' · 최고기록 '+prev+(task.record==='steps'?' 스텝':'초');
  PRESULT='✓ 통과 — '+steps+' 스텝 · '+sec.toFixed(1)+'초 · 알람 '+alarms+'건'+extra;
  C.ptask=C.ptask||{}; C.ptask[task.id]=true;
  log('S','PROG','과제 통과 : '+task.title+extra);
  ok('과제 통과'+extra);
}

function renderProgTree(){
  const el=document.getElementById('pTree'); if(!el) return;
  if(!PROG||!Array.isArray(PROG.body)){ el.innerHTML='<div class="empty">검증을 누르면 프로그램 구조가 여기에 보입니다</div>'; return; }
  const rows=[];
  (function walk(list, path, d){
    list.forEach((n,i)=>{
      const at=path+'['+i+']';
      const st = PST.cur===at ? 'cur' : (PST.done[at]||'');
      const arg = n.arg!==undefined?' '+n.arg : (n.var!==undefined?' $'+n.var+' = '+n.value : (n.cond!==undefined?' ('+n.cond+')' : (n.count!==undefined?' × '+n.count:'')));
      rows.push(`<div class="sq ${st}" style="padding-left:${8+d*14}px"><span class="n">${rows.length+1<100?String(rows.length+1).padStart(2,'0'):rows.length+1}</span><span>${esc(n.op+arg)}</span></div>`);
      if(Array.isArray(n.body)) walk(n.body, at+'.body', d+1);
      if(Array.isArray(n.then)) walk(n.then, at+'.then', d+1);
      if(Array.isArray(n.else)) walk(n.else, at+'.else', d+1);
    });
  })(PROG.body,'body',0);
  el.innerHTML=rows.join('');
  const c=el.querySelector('.cur'); if(c&&c.scrollIntoView) c.scrollIntoView({block:'nearest'});
}

function drillNow(){
  const d=DR.d; if(!d) return null;
  if(d.type==='tour'&&DR.tgt)  return '목표 자세 → '+ST.efem[DR.tgt.st].n+' · Z '+DR.tgt.z+' · 팔 수축';
  if(d.type==='route')         return '아직 안 간 곳 '+DR.rem.length+'군데 → '+DR.rem.map(t=>
                                  stShort(t.st)+' Z'+t.z).join(' / ');
  if(d.type==='goal')          return (d.goals[DR.idx]||{}).t || '완료';
  if(d.type==='codes')         return '띄울 알람 → '+(d.codes.filter(c=>!DR.got.includes(c)).join(' · ')||'완료');
  if(d.type==='value')         return '문항 '+(DR.qi+1)+' — 훈련 탭으로 돌아가 답하세요';
  if(d.type==='predict')       return '예측 '+(DR.idx+1)+' / '+d.rounds.length+' — 훈련 탭에서 바뀔 신호를 고르세요';
  if(d.type==='exam')          return DR.ex.phase==='act'
                                  ? ((d.goals[DR.idx]||{t:()=>'완료'}).t()+' · 남은 '+Math.max(0,d.actLimitSec-drillElapsed())+'초')
                                  : '퀴즈 '+(DR.qi+1)+'번 — 훈련 탭에서 답하세요';
  return '';
}
function drillProg(){
  const d=DR.d; if(!d) return '';
  if(d.type==='codes') return DR.got.length+' / '+d.codes.length;
  if(d.type==='goal')  return DR.idx+' / '+d.goals.length;
  if(d.type==='value') return DR.qi+' / '+d.qs.length;
  if(d.type==='predict') return DR.idx+' / '+d.rounds.length;
  if(d.type==='exam')  return examProg();
  if(d.type==='route') return DR.idx+' / '+d.n;
  return DR.idx+' / '+d.n;
}

  if(a==='seqDel'){SEQ.splice(+arg,1);renderPane();return;}
  if(a==='qz'){ const [wn,qi,ai]=arg.split(':'); QZ[wn+'-'+qi]=+ai; renderPane(); return; }
  if(a==='qzNew'){ const wn=WEEK[WK].n;
    /* 방금 본 문항과 겹치지 않게 뽑되, 은행이 작으면 겹침을 허용한다 */
    const bank=(GUIDE[wn]&&GUIDE[wn].qz)||[], prev=QZP['sel-'+wn]||[];
    const rest=shuffled(bank.length).filter(i=>!prev.includes(i));
    const pick=rest.concat(shuffled(bank.length).filter(i=>!rest.includes(i))).slice(0,Math.min(QZ_SHOW,bank.length));
    QZP['sel-'+wn]=pick;
    pick.forEach(i=>{ delete QZ[wn+'-'+i]; delete QZP[wn+'-'+i]; });
    renderPane(); return; }
  if(a==='goTab'){ if(WEEK[WK].tabs.includes(arg)){ TAB=arg; renderTabs(); renderPane(); renderStatus(); } return; }
  if(a==='drGo'){ drillStart(arg); renderPane(); renderStatus(); return; }
  if(a==='drAns'){ const el=document.getElementById('drIn');
    drillAnswer(el?el.value:''); renderPane(); renderStatus(); return; }
  if(a==='drOpt'){ drillAnswer(arg); renderPane(); renderStatus(); draw(); return; }
  if(a==='prTog'){ predToggle(arg); renderPane(); return; }
  if(a==='prRun'){ predRun(); renderPane(); renderStatus(); return; }
  if(a==='prNext'){ predNext(); renderPane(); renderStatus(); return; }
  if(a==='drEx'){ examPick(arg); renderPane(); renderStatus(); return; }
  if(a==='drExNext'){ examNext(); renderPane(); renderStatus(); return; }
  if(a==='pTask'){ PTASK=(PTASK===arg?null:arg); PRESULT='';
    { const t=pTask(); if(t&&t.setup){ reset(false); t.setup(); } }
    renderPane(); renderStatus(); draw(); return; }
  if(a==='rptCause'){ RPT.causeKey=(RPT.causeKey===arg?null:arg); RPT_SCORE=null; RPT_DONE=false; renderPane(); return; }
  if(a==='flt'){S.fault[arg]=!S.fault[arg];
    if(S.fault[arg]){ C.flt++; faultRoll(arg); }log(S.fault[arg]?'W':'I','FAULT',(S.fault[arg]?'주입':'해제')+' : '+FAULTS.find(f=>f[0]===arg)[1]);renderPane();return;}
  if(A[a]) OPS++;                        // 로봇 조작만 센다
  (UI[a]||A[a]||(()=>{}))();
  renderPane(); renderStatus(); renderMissions();
});
$('#estop').onclick=()=>{A.estop();$('#estop').classList.toggle('on',S.estop);renderPane();renderStatus();};

/* 단축키 */
addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(bookOpen())return;                       // 교재를 보는 동안엔 장비 단축키 차단
  const k={ArrowLeft:'rotL',ArrowRight:'rotR',ArrowUp:'up',ArrowDown:'dn',
    e:'ext',r:'ret',h:'home',p:'pick',o:'place',i:'init'}[e.key];
  if(e.key==='Tab'){e.preventDefault();A.swap();renderPane();renderStatus();return;}
  if(!k)return; e.preventDefault(); OPS++; A[k](); renderPane(); renderStatus();
});

/* 메인 루프 */
let last=performance.now(), acc=0;
function loop(t){
  const dt=Math.min((t-last)/1000,0.05); last=t; acc+=dt;
  tick(dt); draw(); drillTick();
  liveUpdate();
  if(acc>0.4){ acc=0; renderStatus(); renderMissions(); }
  requestAnimationFrame(loop);
}
/* ── 교재(데크) 오버레이 ────────────────────────────────
   데크 경로는 URL 파라미터 deck 으로 받는다.
   · 서고: /topic-sims/ 와 /topic-decks/ 가 다른 폴더 → 래퍼(jsx)가 절대경로를 넘김
   · 단독 실행: 같은 폴더에 둔다고 보고 상대경로
   경로를 코드가 추측해서 만들지 않도록 기본값을 하나로만 둔다. */
const _BQP=new URLSearchParams(location.search);
const DECKDIR=_BQP.get('deckdir')||'/topic-decks/wafer-transfer';
const DECKONE=_BQP.get('deck'); // 명시적 단일 데크(하위호환)
function deckURL(i){ return DECKONE || (DECKDIR+'/ch'+String(WEEK[i].n).padStart(2,'0')+'.html'); }
let bookCh=-1;
function updateBookBar(){ const w=WEEK[WK], t=$('#bookTitle');
  if(t) t.textContent='CH '+String(w.n).padStart(2,'0')+' · '+w.t; }
function refitBook(){ const f=$('#book');
  try{ f&&f.contentWindow&&f.contentWindow.dispatchEvent(new Event('resize')); }catch(e){} }
function loadBook(){ const f=$('#book'); if(!f) return;
  if(bookCh!==WK){ bookCh=WK; const e=$('#bookerr'); if(e) e.remove(); f.style.display=''; f.src=deckURL(WK);
    f.onload=refitBook;
    f.onerror=()=>{ f.style.display='none'; const d=document.createElement('div'); d.id='bookerr';
      d.innerHTML='교재 파일을 찾지 못했습니다.<br><span style="font-family:var(--mono);font-size:11px;color:#6d90aa">'+deckURL(WK)+'</span>';
      $('#bookwrap').appendChild(d); }; }
  else { refitBook(); }
  updateBookBar(); }
function openBook(){ $('#bookwrap').classList.remove('hide'); $('#bookpdf').style.display=''; loadBook();
  [60,240,480].forEach(t=>setTimeout(refitBook,t)); }
/* 교재가 아닌 다른 화면(예: 6강의 '같은 개념, 다른 현장' 로봇 셋업 시뮬)을 같은 오버레이에 연다.
   bookCh 를 지워 두어 다음에 📖 교재를 누르면 데크를 다시 불러온다. PDF 버튼은 데크 전용이라 숨긴다. */
const ANALOGY_URL=(_BQP.get('analogy')||'/topic-sims/robot-setup-analogy.html');
function openExt(url,title){ const f=$('#book'); if(!f) return;
  const e=$('#bookerr'); if(e) e.remove(); f.style.display=''; f.onerror=null;
  bookCh=-1; f.src=url; f.onload=refitBook;
  const t=$('#bookTitle'); if(t) t.textContent=title;
  $('#bookpdf').style.display='none';
  $('#bookwrap').classList.remove('hide'); [60,240,480].forEach(x=>setTimeout(refitBook,x)); }
function closeBook(){ $('#bookwrap').classList.add('hide'); }
const bookOpen=()=>!$('#bookwrap').classList.contains('hide');
$('#bookbtn').onclick=()=>{ bookOpen()?closeBook():openBook(); };
$('#bookclose').onclick=closeBook;
/* 챕터 PDF — 같은 데크를 ?print=1 로 새 탭에 열면 그쪽에서 인쇄 대화상자가 뜬다.
   iframe 안에서 print() 를 부르면 브라우저마다 결과가 달라서 새 탭으로 뺀다. */
$('#bookpdf').onclick=()=>{
  const u=deckURL(WK); window.open(u+(u.indexOf('?')>=0?'&':'?')+'print=1','_blank','noopener');
};
addEventListener('keydown',e=>{ if(e.key==='Escape'&&bookOpen()){ e.preventDefault(); closeBook(); } });

/* 서고에서 mount 옵션으로 특정 챕터만 열 수 있게: ?ch=5&lock=1
   (이전에 쓰던 unit= · week= 도 계속 인식한다) */
const QP=new URLSearchParams(location.search);
const W0=Math.max(1,Math.min(WEEK.length,+QP.get('ch')||+QP.get('unit')||+QP.get('week')||1))-1;
if(QP.get('lock')==='1'){ $('#weekbar').style.display='none'; }
setWeek(W0);
log('I','BOOT','시뮬레이터 준비 완료. 챕터을 선택하면 장비가 초기 상태로 돌아갑니다.');
requestAnimationFrame(loop);
</script>
