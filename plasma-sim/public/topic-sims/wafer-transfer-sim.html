<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>웨이퍼 이송장치 시뮬레이터 · 로봇및센서실습</title>
<style>
:root{
  --bg:#0b141c; --bg2:#101d28; --panel:#14222f; --panel2:#1a2c3c;
  --line:#25405a; --line2:#1a2f42;
  --tx:#d7e6f2; --tx2:#7e9bb3; --tx3:#4d6c85;
  --ok:#2fe0c0; --run:#4aa8ff; --warn:#ffb340; --bad:#ff5e5e;
  --wafer:#b9cede; --vac:#9b8cff; --atm:#3fd0e6;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 20% -10%, #16293a 0%, transparent 60%),
    var(--bg);
  color:var(--tx); font-family:var(--sans); font-size:14px; overflow:hidden;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible{outline:2px solid var(--ok);outline-offset:2px}

/* ── 헤더 ─────────────────────────── */
#top{
  height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;
  border-bottom:1px solid var(--line2); background:rgba(9,17,24,.9);
}
#brand{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--tx3)}
#brand b{color:var(--ok);font-weight:600}
#weekbar{display:flex;gap:3px;overflow-x:auto;flex:1;padding:2px}
#weekbar::-webkit-scrollbar{height:0}
.wk{
  min-width:34px;height:30px;border-radius:4px;background:var(--panel);
  border:1px solid var(--line2); font-family:var(--mono);font-size:12px;color:var(--tx2);
  transition:.12s;
}
.wk:hover{border-color:var(--line);color:var(--tx)}
.wk.on{background:var(--ok);color:#052b25;border-color:var(--ok);font-weight:700}
.wk.rev{border-color:#4a5c3a;color:#b9d09a}
.wk.rev.on{background:#9fd06a;color:#16250a;border-color:#9fd06a}
#estop{
  padding:0 14px;height:32px;border-radius:4px;background:#3a1414;color:#ff8a8a;
  border:1px solid #6b2020;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
}
#estop.on{background:var(--bad);color:#fff;animation:blink .6s infinite}
@keyframes blink{50%{opacity:.45}}

/* ── 본체 ─────────────────────────── */
#main{display:flex;height:calc(100vh - 52px)}
#left{flex:1;min-width:0;display:flex;flex-direction:column}
#right{width:396px;border-left:1px solid var(--line2);display:flex;flex-direction:column;background:var(--bg2)}

/* 학습 헤더 */
#lesson{padding:12px 18px 10px;border-bottom:1px solid var(--line2)}
#lsTag{font-family:var(--mono);font-size:11px;color:var(--ok);letter-spacing:.14em}
#lsTitle{font-size:19px;font-weight:700;margin-top:3px;letter-spacing:-.02em}
#lsGoal{color:var(--tx2);font-size:13px;margin-top:4px;line-height:1.5}

/* 도면 */
#stagewrap{flex:1;position:relative;min-height:0;padding:6px 10px 0}
svg#fab{width:100%;height:100%;display:block}
.chm{fill:#101f2c;stroke:var(--line);stroke-width:1.5}
.chm.dim{opacity:.26}
.chm.run{fill:#2a1f0c;stroke:#ffb340;stroke-width:2.5}
.chm.rdy{fill:#0d2a25;stroke:#35e0c8;stroke-width:2.5}
@keyframes pmpulse{0%,100%{opacity:1}50%{opacity:.55}}
.chm.run{animation:pmpulse 1.1s ease-in-out infinite}
.lbl{font-family:var(--mono);font-size:11px;fill:var(--tx3);letter-spacing:.08em}
.lbl2{font-family:var(--mono);font-size:9px;fill:#3d5f7a}
.hot{cursor:pointer}
.hot:hover .chm{stroke:var(--ok)}
.wf{fill:var(--wafer);stroke:#e8f4ff;stroke-width:1}
.notch{fill:#0b141c}
.led{stroke:#0b141c;stroke-width:1}
.arm{fill:#2c4b66;stroke:#4a7ea6;stroke-width:1.5}
.eff{fill:#3b6a8f;stroke:#7fc4ea;stroke-width:1.5}
.flash{animation:fl .35s 3}
@keyframes fl{0%,100%{stroke:var(--bad);stroke-width:4}50%{stroke:#ff9f9f;stroke-width:1}}

/* 상태바 */
#status{
  height:30px;display:flex;align-items:center;gap:0;border-top:1px solid var(--line2);
  font-family:var(--mono);font-size:11px;background:#0a131b;
}
#status div{padding:0 12px;border-right:1px solid var(--line2);color:var(--tx3);white-space:nowrap}
#status b{color:var(--tx);font-weight:500}
/* 훈련 중에는 어느 탭에 있든 목표가 보여야 한다 */
#status div.drl{background:#10241f;border-right:1px solid #2c6d63;color:var(--ok)}
#status div.drl b{color:#7af0da}
#toast{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
  padding:9px 16px;border-radius:5px;font-family:var(--mono);font-size:12px;
  background:#2a1010;color:#ffb0b0;border:1px solid #7a2a2a;opacity:0;
  transition:.2s;pointer-events:none;max-width:80%;
}
#toast.show{opacity:1}
#toast.ok{background:#0d2a25;color:#8ff0dd;border-color:#1f6b5c}

/* 탭 */
#tabs{display:flex;border-bottom:1px solid var(--line2);background:#0d1a24;flex-wrap:wrap}
.tb{
  padding:9px 11px;font-size:12px;color:var(--tx3);border-bottom:2px solid transparent;
}
.tb:hover{color:var(--tx)}
.tb.on{color:var(--ok);border-bottom-color:var(--ok);background:rgba(47,224,192,.06)}
.tb[disabled]{opacity:.25;cursor:not-allowed}
#pane{flex:1;overflow-y:auto;padding:14px}
#pane::-webkit-scrollbar{width:8px}
#pane::-webkit-scrollbar-thumb{background:#1f3446;border-radius:4px}
.hide{display:none!important}

h4.sec{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--tx3);
  margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line2);
}
h4.sec:first-child{margin-top:0}
.grid{display:grid;gap:6px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}
.btn{
  padding:9px 6px;border-radius:5px;background:var(--panel);border:1px solid var(--line2);
  font-size:12px;color:var(--tx);text-align:center;transition:.1s;
}
.btn:hover:not([disabled]){background:var(--panel2);border-color:var(--line)}
.btn:active:not([disabled]){transform:translateY(1px)}
.btn[disabled]{opacity:.3;cursor:not-allowed}
.btn.k{font-family:var(--mono);font-size:11px}
.btn.on{background:rgba(47,224,192,.16);border-color:var(--ok);color:var(--ok)}
.btn.hot{border-color:#6b4a20;color:var(--warn)}
.btn.danger{border-color:#6b2626;color:#ff9a9a}
.seg{display:flex;gap:0;border:1px solid var(--line2);border-radius:5px;overflow:hidden}
.seg button{flex:1;padding:8px;font-size:12px;background:var(--panel);color:var(--tx2)}
.seg button.on{background:var(--ok);color:#052b25;font-weight:700}

.row{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:4px;background:var(--panel);margin-bottom:4px;font-size:12px}
.row .v{font-family:var(--mono);font-size:11px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}
.hint{font-size:11px;color:var(--tx3);line-height:1.6;margin-top:8px}
.hint b{color:var(--tx2);font-weight:600}

/* 미션 */
.ms{display:flex;gap:9px;padding:8px 9px;border-radius:5px;background:var(--panel);margin-bottom:5px;font-size:12px;line-height:1.45;align-items:flex-start}
.ms .cb{width:16px;height:16px;border-radius:3px;border:1px solid var(--line);flex:none;margin-top:1px;font-family:var(--mono);font-size:11px;text-align:center;line-height:14px;color:transparent}
.ms.done{background:rgba(47,224,192,.08)}
.ms.done .cb{background:var(--ok);border-color:var(--ok);color:#052b25}
.ms.done span{color:var(--tx2);text-decoration:line-through}
#msBar{height:3px;background:var(--line2);border-radius:2px;overflow:hidden;margin-bottom:10px}
#msBar i{display:block;height:100%;background:var(--ok);width:0;transition:.3s}

/* 시퀀스 */
#seqList{min-height:80px;border:1px dashed var(--line2);border-radius:6px;padding:6px;margin-bottom:8px}
.sq{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:4px;background:var(--panel);margin-bottom:3px;font-family:var(--mono);font-size:11px}
.sq .n{color:var(--tx3);width:18px}
.sq .x{margin-left:auto;color:var(--tx3);padding:0 4px}
.sq .x:hover{color:var(--bad)}
.sq.cur{background:rgba(74,168,255,.18);border:1px solid var(--run)}
.sq.ok{color:var(--ok)}
.sq.err{background:rgba(255,94,94,.14);color:#ff9a9a}
.empty{color:var(--tx3);font-size:11px;text-align:center;padding:16px;font-family:var(--mono)}

/* 로그 */
#log{font-family:var(--mono);font-size:11px;line-height:1.65}
.lg{padding:5px 8px;border-left:2px solid var(--line);margin-bottom:3px;background:#0f1c26;border-radius:0 4px 4px 0}
.lg.E{border-left-color:var(--bad);color:#ffabab;background:#1d1114}
.lg.W{border-left-color:var(--warn);color:#ffd49a}
.lg.I{border-left-color:var(--run);color:#9fcdf5}
.lg.S{border-left-color:var(--ok);color:#8ff0dd}
.lg .t{color:var(--tx3);margin-right:7px}

textarea,input,select{
  width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:4px;
  color:var(--tx);padding:7px 9px;font-family:var(--mono);font-size:11px;resize:vertical;
}
label.f{display:block;font-family:var(--mono);font-size:10px;color:var(--tx3);letter-spacing:.1em;margin:9px 0 3px}
table.tb2{width:100%;border-collapse:collapse;font-size:11px}
.tb2 th,.tb2 td{text-align:left;padding:6px 7px;border-bottom:1px solid var(--line2);vertical-align:top}
.tb2 th{font-family:var(--mono);font-size:10px;color:var(--tx3);letter-spacing:.1em;font-weight:400}

.why{font-size:12.5px;line-height:1.75;color:#a9c4d8;background:var(--panel);border-left:3px solid var(--ok);
  border-radius:0 6px 6px 0;padding:11px 14px;margin-bottom:2px}
.nowb{background:rgba(74,168,255,.12);border:1px solid #2f5f8a;border-radius:7px;padding:11px 13px;margin-bottom:10px}
.nowb .nl{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:#78b4e8;margin-bottom:5px}
.nowb b{display:block;font-size:13px;color:#eaf5ff;line-height:1.5;font-weight:600}
.nowb em{display:block;font-style:normal;font-size:12px;line-height:1.65;color:#9fc4de;margin-top:7px;
  padding-top:7px;border-top:1px dashed #2f5f8a}
.nowb.ok{background:rgba(47,224,192,.1);border-color:#1f6b5c;color:#9ff0e0;font-size:12.5px;line-height:1.6}
.ms.at{background:rgba(74,168,255,.1);border:1px solid #2f5f8a}
.qz{background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:11px 12px;margin-bottom:8px}
.qq{font-size:12.5px;line-height:1.55;color:#eaf5ff;margin-bottom:9px;font-weight:600}
.qa{display:block;width:100%;text-align:left;padding:8px 11px;border-radius:5px;background:var(--panel2);
  border:1px solid var(--line2);font-size:12px;color:var(--tx);margin-bottom:4px;transition:.12s}
.qa:hover{border-color:var(--line)}
.qa.ok{background:rgba(47,224,192,.16);border-color:var(--ok);color:var(--ok)}
.qa.no{background:rgba(255,94,94,.14);border-color:#7a3232;color:#ff9a9a}
.qe{font-size:11.5px;line-height:1.65;color:var(--tx2);margin-top:7px;padding-top:7px;border-top:1px solid var(--line2)}

.drun{background:rgba(74,168,255,.12);border:1px solid #2f5f8a;border-radius:8px;padding:12px;margin-bottom:12px}
.drun .dl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:#78b4e8;margin-bottom:8px}
.dtg{display:flex;align-items:baseline;gap:10px;margin-bottom:5px}
.dtg span{font-size:19px;font-weight:700;color:#eaf5ff}
.dtg b{font-family:var(--mono);font-size:17px;color:var(--ok)}
.dsub{font-size:11px;color:var(--tx3);line-height:1.6;margin-bottom:3px}
.dord{font-size:11px;color:#9dc9ee;margin-bottom:4px}
.dnow{font-size:11.5px;color:var(--tx2);margin:2px 0 6px;font-family:var(--mono)}
.dnow b{color:#eaf5ff}
.dbox{background:rgba(0,0,0,.22);border:1px solid #2a4c6d;border-radius:6px;padding:9px 10px;margin:8px 0}
.dbox .bl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:#78b4e8;margin-bottom:5px}
.dbox .bt{font-size:11.5px;line-height:1.65;color:var(--tx2)}
.dbox .bt b{color:#eaf5ff}
.dbox ul{margin:4px 0 0;padding-left:16px}
.dbox li{font-size:11px;line-height:1.6;color:var(--tx2);margin-bottom:2px}
.dwarn{background:rgba(255,176,32,.13);border:1px solid #7d5c14;border-radius:6px;padding:9px 10px;
  margin:8px 0;font-size:11.5px;line-height:1.6;color:#ffd894}
.dwarn b{color:#ffe9bd}
.dmov{background:rgba(47,224,192,.10);border:1px solid #1f6b5c;border-radius:6px;
  padding:8px 10px;margin:6px 0 4px;font-size:12.5px;line-height:1.6;color:#bfe9e1}
.dmov b{color:var(--ok);font-weight:700}
.dmov .ml{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:#5fbfae;margin-bottom:3px}
.dmov i{display:block;font-style:normal;font-size:11px;color:var(--tx3);margin-top:3px}
.dmov.ok{background:rgba(47,224,192,.16)}
.dgo{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dgo .btn{flex:1 1 auto;min-width:112px;font-size:11px;padding:8px 9px}
.dstat{display:flex;gap:14px;margin-top:9px;padding-top:8px;border-top:1px dashed #2f5f8a;
  font-size:11px;color:var(--tx3);font-family:var(--mono)}
.dstat b{color:#eaf5ff;font-weight:600}
.chip{display:inline-block;font-family:var(--mono);font-size:10px;padding:3px 7px;border-radius:4px;
  background:var(--panel);border:1px solid var(--line2);color:var(--tx3);margin-right:4px}
.chip.on{background:rgba(47,224,192,.16);border-color:var(--ok);color:var(--ok)}
.dcard{background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:11px 12px;margin-bottom:7px}
.dcard.done{border-color:#1f6b5c;background:rgba(47,224,192,.06)}
.dcard .dt{font-size:13px;font-weight:700;color:#eaf5ff;margin-bottom:5px}
.dcard .ck{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ok);margin-left:7px}
.dcard .dd{font-size:11.5px;line-height:1.6;color:var(--tx2)}
.dcard .dwhere{font-family:var(--mono);font-size:10px;color:#78b4e8;margin-top:5px}
.dcard .drec{font-family:var(--mono);font-size:10.5px;color:var(--ok);margin-top:5px}
.dfail{background:rgba(255,94,94,.13);border:1px solid #7a3232;border-radius:7px;padding:10px 12px;
  font-size:12px;color:#ffabab;margin-bottom:10px;line-height:1.5}
.dok{background:rgba(47,224,192,.11);border:1px solid #1f6b5c;border-radius:7px;padding:10px 12px;
  font-size:12px;color:#8ff0dd;margin-bottom:10px;line-height:1.5}

#bookbtn{padding:0 13px;height:32px;border-radius:4px;background:var(--panel);color:var(--tx2);
  border:1px solid var(--line);font-size:12px;white-space:nowrap;transition:.12s}
#bookbtn:hover{background:var(--panel2);color:var(--ok);border-color:var(--ok)}
#bookwrap{position:fixed;inset:0;z-index:60;background:#070f16;display:flex;flex-direction:column}
#bookbar{height:44px;display:flex;align-items:center;gap:12px;padding:0 14px;
  border-bottom:1px solid var(--line2);background:#0b141c;flex:none}
#bookbar .t{font-size:13px;color:var(--tx);font-weight:600}
#bookbar .s{font-family:var(--mono);font-size:11px;color:var(--tx3);letter-spacing:.1em}
#bookbar .sp{flex:1}
#bookbar button{padding:6px 13px;border-radius:4px;background:var(--panel);border:1px solid var(--line2);
  font-size:12px;color:var(--tx2)}
#bookbar button:hover{color:var(--tx);border-color:var(--line)}
#bookpdf{background:var(--ok);border-color:var(--ok);color:#03231e;font-weight:700}
#bookpdf:hover{color:#03231e;filter:brightness(1.08)}
#book{flex:1;width:100%;border:0;background:#0a141c}
#bookerr{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;
  color:var(--tx3);font-size:13px;line-height:1.9;padding:40px}
@media(max-width:1100px){#right{width:340px}}

/* ── 폰 ─────────────────────────────
   좌우 두 칸을 나란히 두면 폰에서는 도면 칸이 50px 로 짜부라진다.
   위아래로 쌓고 페이지를 세로로 스크롤한다. 손가락으로 누를 것은 44px 로. */
@media(max-width:820px){
  html,body{height:auto}
  body{overflow:auto;-webkit-text-size-adjust:100%}

  #top{height:auto;flex-wrap:wrap;gap:8px;padding:8px 12px}
  #brand{width:100%;font-size:11px}
  #weekbar{order:3;width:100%;flex:none;gap:6px;padding:2px 0}
  .wk{min-width:44px;height:44px;font-size:13px}
  #bookbtn,#estop{height:44px;padding:0 16px;font-size:12px}

  #main{display:block;height:auto}
  #left{display:block}
  #stagewrap{height:62vw;min-height:250px;padding:8px 8px 0}
  #status{height:auto;flex-wrap:wrap;padding:4px 0}
  #status div{padding:4px 10px}

  #right{width:auto;border-left:0;border-top:1px solid var(--line2)}
  #tabs .tb{min-height:44px;padding:0 14px}
  #pane{padding-bottom:24px}
  /* 오른쪽 패널 안의 조작 버튼·체크박스도 손가락 크기로 */
  #right button,#left button{min-height:44px}
  #right input[type="checkbox"]{width:22px;height:22px}

  /* 교재 오버레이 */
  #bookbar{height:auto;flex-wrap:wrap;padding:6px 10px;gap:8px}
  #bookbar button{min-height:44px}
  #bookbar .s{font-size:10px}
}
</style>
</head>
<body>

<div id="top">
  <div id="brand">WAFER TRANSFER <b>SIM</b></div>
  <div id="weekbar"></div>
  <button id="bookbtn">📖 교재</button>
  <button id="estop">E-STOP</button>
</div>

<div id="main">
  <div id="left">
    <div id="lesson">
      <div id="lsTag"></div>
      <div id="lsTitle"></div>
      <div id="lsGoal"></div>
    </div>
    <div id="stagewrap">
      <svg id="fab" viewBox="0 0 900 520" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="toast"></div>
    </div>
    <div id="status"></div>
  </div>

  <div id="right">
    <div id="tabs"></div>
    <div id="pane"></div>
  </div>
</div>

<div id="bookwrap" class="hide">
  <div id="bookbar">
    <span class="s">교재</span><span class="t" id="bookTitle">웨이퍼 이송 로봇과 센서</span>
    <span class="sp"></span>
    <span class="s">← → 슬라이드 넘기기 · Esc 닫기</span>
    <button id="bookpdf" title="이 챕터 전체를 PDF 로 저장합니다">📄 PDF 저장</button>
    <button id="bookclose">닫기 ✕</button>
  </div>
  <iframe id="book" title="교과서 데크"></iframe>
</div>

<script>
"use strict";
/* =========================================================================
   1. 장비 모델 (엔진) — UI와 분리. 나중에 React 시뮬로 이식할 때 이 블록만 가져감
   ========================================================================= */
const RET = 60;                       // 로봇 암 수축 위치(px)
const ST = {                          // 스테이션 정의 (각도는 SVG 좌표계, y-down)
  efem:[
    {k:'foup',   n:'FOUP',        ang:180, d:209},
    {k:'aligner',n:'Pre-aligner', ang:-90, d:120},
    {k:'ll',     n:'Load Lock',   ang:0,   d:205}
  ],
  vac:[
    {k:'ll',  n:'Load Lock',        ang:180, d:185},
    {k:'pm1', n:'Process Chamber1', ang:-90, d:120},
    {k:'pm2', n:'Process Chamber2', ang:90,  d:120}
  ]
};
const CX={efem:[320,260], vac:[750,260]};
/* 공정 시간(초). 둘이 다르기 때문에 어느 챔버로 먼저 보낼지가 판단이 된다. */
const PMT={pm1:10, pm2:22};
const pmLeft=k=>Math.max(0, PMT[k]-S[k].t);

let S, C, LOG, HIST;
function reset(hard){
  S = {
    who:'efem',
    efem:{homed:false,init:false,si:0,R:RET,Rt:RET,a:180,at:180,z:3,wafer:null},
    vac :{homed:false,init:false,si:0,R:RET,Rt:RET,a:180,at:180,z:3,wafer:null},
    lp  :{docked:false,door:false,mapped:false,map:[]},
    ll  :{p:760,pump:false,vent:false,atmV:false,tmV:false,wafer:null,et:0},
    al  :{wafer:null,notch:0,aligning:false},
    pm1 :{wafer:null,t:0,run:false}, pm2:{wafer:null,t:0,run:false},
    foup:[1,2,3,4,5].map(i=>({slot:i,wafer:i<=3?{id:'W'+i,al:false,notch:(i*47)%360}:null})),
    estop:false, fault:{pump:false,leak:false,map:false,wps:false,grip:false,enc:false,teach:false,
                         mapSlot:1, teachOff:1, encDev:0},
    /* 도면 장치를 눌러 본 기록. 훈련 시작의 soft reset 에서는 지우지 않는다 — 지우면 7강 미션 ③
       (FOUP 을 눌러 실물 보기)이 훈련을 시작하는 순간 다시 풀렸다. */
    inspect:(hard||typeof S==='undefined'||!S)?{}:S.inspect,
    limHit:0            // 마지막으로 Z 한계 밖 이동이 거부된 시각 — 센서 모니터의 Limit 줄이 잠깐 빨갛게 반응한다
  };
  if(hard){ C={pick:0,place:0,plAl:0,align:0,retH:0,pump:0,vent:0,map:0,dock:0,seq:0,home:0,rot:0,ext:0,zmv:0,alarm:0,fix:0,ins:0,prog:0,flt:0,ptask:{},ilk:{}}; LOG=[]; HIST=[]; }
}
reset(true);

const now=()=>new Date().toLocaleTimeString('en-GB',{hour12:false});
function log(lv,code,msg){
  LOG.unshift({lv,code,msg,t:now()});
  if(lv==='E'){C.alarm++;}
  if(LOG.length>200)LOG.pop();
  renderLog(); renderStatus();
}
function fail(code,msg,part){
  log('E',code,msg); toast(msg,false); flash(part);
  C.ilk[code]=(C.ilk[code]||0)+1;
}
const R=()=>S[S.who], other=()=>S[S.who==='efem'?'vac':'efem'];
const sts=()=>ST[S.who];
const cur=()=>sts()[R().si];
const busy=r=>Math.abs(r.R-r.Rt)>0.7||Math.abs(r.a-r.at)>0.7;
const extended=r=>r.R>RET+3;
/* 두 각도의 차 (-180~180). 엔코더 편차 판정에 쓴다. */
const angDiff=(a,b)=>{ let d=(a-b)%360; if(d>180)d-=360; if(d<-180)d+=360; return d; };
/* 지금 겨냥한 스테이션의 실제 각도와 로봇이 서 있는 각도의 차 */
const posDev=r=>angDiff(r.a, (S.who==='efem'?ST.efem:ST.vac)[r.si].ang);

/* 스테이션에 놓인 웨이퍼 읽기/쓰기 */
function stW(who,k,val){
  const set=arguments.length>2;
  if(k==='foup'){
    /* Z축 티칭이 틀어지면 겨냥한 칸과 실제로 손이 닿는 칸이 어긋난다 */
    const z=S[who].z + ((S.fault.teach&&who==='efem') ? (S.fault.teachOff|0) : 0);
    const s=S.foup.find(x=>x.slot===z); if(!s)return null;
    if(set){s.wafer=val;} return s.wafer; }
  if(k==='aligner'){ if(set){S.al.wafer=val; if(!val)S.al.notch=0;} return S.al.wafer; }
  if(k==='ll'){ if(set){S.ll.wafer=val;} return S.ll.wafer; }
  if(k==='pm1'||k==='pm2'){ if(set){S[k].wafer=val;} return S[k].wafer; }
  return null;
}

/* ── 인터록: 동작 전에 반드시 통과해야 하는 조건 ───────────────── */
function guard(act){
  const r=R(), w=S.who, st=cur();
  if(S.estop && act!=='reset'){ fail('ALM-000','비상정지 상태입니다. Reset으로 해제하세요.','estop'); return false; }
  if(act!=='init'&&act!=='reset'&&!r.init){ fail('ALM-101','Initialize가 완료되지 않았습니다.','robot'); return false; }
  if(['ext','rot','pick','place','z'].includes(act)&&!r.homed){ fail('ALM-102','Home 미완료 상태에서는 축을 움직일 수 없습니다.','robot'); return false; }
  if(busy(r)&&act!=='reset'){ fail('ALM-103','축이 이동 중입니다. 정지 후 실행하세요.','robot'); return false; }

  if(act==='rot'&&extended(r)){ fail('ALM-201','암이 전진한 상태에서 회전 → Collision Interlock.','robot'); return false; }
  if(act==='z' &&extended(r)){ fail('ALM-202','암이 전진한 상태에서 Z축 이동 금지.','robot'); return false; }

  if(act==='ext'){
    const dev=posDev(r);
    if(Math.abs(dev)>3){
      fail('ALM-405','θ축 위치가 목표와 일치하지 않습니다 (편차 '+dev.toFixed(0)+'°) — Position Interlock.','robot');
      return false; }
    if(w==='efem'&&st.k==='foup'&&!S.lp.door){ fail('ALM-301','Load Port Door가 닫혀 있습니다 (Door Interlock).','lp'); return false; }
    if(w==='efem'&&st.k==='foup'&&!S.lp.docked){ fail('ALM-302','FOUP이 Docking되지 않았습니다.','lp'); return false; }
    if(w==='efem'&&st.k==='ll'&&!S.ll.atmV){ fail('ALM-303','대기측 Gate Valve가 닫혀 있습니다.','ll'); return false; }
    if(w==='vac' &&st.k==='ll'&&!S.ll.tmV){ fail('ALM-304','진공측 Gate Valve가 닫혀 있습니다.','ll'); return false; }
  }
  if(act==='pick'||act==='place'){
    if(!extended(r)){ fail('ALM-203','암이 전진(Extend)하지 않았습니다.','robot'); return false; }
  }
  return true;
}

/* ── 동작 프리미티브 ───────────────────────────────────────── */
const A={};
A.init=()=>{ const r=R(); r.init=true; r.homed=false; log('I','INIT',(S.who==='efem'?'EFEM':'Vacuum')+' Robot 초기화 완료. Home을 실행하세요.'); ok('Initialize 완료'); return true; };
A.home=()=>{ if(!guard('home'))return false; const r=R(); r.Rt=RET; r.at=sts()[r.si].ang; r.homed=true; C.home++; log('S','HOME','Home Position 복귀. Home Sensor ON.'); ok('Home 완료'); return true; };
A.ext =()=>{ if(!guard('ext'))return false; const r=R(); r.Rt=cur().d; C.ext++; log('I','EXT','Extend → '+cur().n); return true; };
A.ret =()=>{ if(!guard('ret'))return false; const r=R();
  if(r.homed&&extended(r)) C.retH++;   // 뻗어 있던 팔을 넣는다 → Home Sensor 가 OFF → ON 으로 돌아온다
  r.Rt=RET; log('I','RET','Retract 완료 대기'); return true; };
A.rotL=()=>rot(-1); A.rotR=()=>rot(1);
function rot(d){
  if(!guard('rot'))return false;
  const r=R(), n=sts().length; r.si=(r.si+d+n)%n;
  let t=sts()[r.si].ang; while(t-r.a>180)t-=360; while(t-r.a<-180)t+=360;
  r.at=t+(S.fault.enc?(S.fault.encDev||0):0); C.rot++;
  dropIfSlipping();
  log('I','ROT','θ축 회전 → '+sts()[r.si].n); return true;
}
/* 흡착이 약하면 회전 중에 웨이퍼를 떨어뜨린다. 원인을 말해 주지 않고 현상만 남긴다. */
function dropIfSlipping(){
  const r=R();
  if(!S.fault.grip || !r.wafer) return;
  const w=r.wafer; r.wafer=null;
  fail('ALM-506','이송 중 End Effector의 웨이퍼가 사라졌습니다 ('+w.id+') — Wafer Lost.','robot');
}
A.up  =()=>zmv(-1); A.dn=()=>zmv(1);
function zmv(d){
  if(!guard('z'))return false;
  const r=R(), nz=r.z+d;
  if(nz<1||nz>5){ S.limHit=Date.now(); fail('ALM-401','Z축 이동 한계 초과 (Axis Limit).','robot'); return false; }
  r.z=nz; C.zmv++; log('I','ZAXIS','Z축 이동 → Slot / Level '+nz); return true;
}
A.pick=()=>{
  if(!guard('pick'))return false;
  const r=R(), st=cur();
  if(r.wafer){ fail('ALM-501','End Effector에 이미 웨이퍼가 있습니다.','robot'); return false; }
  if((st.k==='pm1'||st.k==='pm2') && S[st.k].run){
    fail('ALM-601','공정 진행 중입니다 — 남은 '+pmLeft(st.k).toFixed(0)+'초. 완료 전에는 반출할 수 없습니다.',st.k);
    return false; }
  /* 정렬대는 도는 동안 웨이퍼를 척에 물고 있다. 이 검사가 없을 때는 정렬 중에 Pick 하면
     알람 없이 정렬 안 된 웨이퍼를 들고 나왔고, 정렬 완료(C.align)도 기록되지 않아
     8강 미션이 이유도 모른 채 막혔다. */
  if(st.k==='aligner' && S.al.aligning){
    fail('ALM-602','Pre-aligner 정렬 중입니다. "정렬 완료" 뒤에 Pick 하세요.','aligner');
    return false; }
  const w=stW(S.who,st.k);
  if(!w){ fail('ALM-502','Wafer Presence Sensor OFF 위치에서 Pick 시도.',st.k); return false; }
  if(S.fault.wps){ fail('ALM-503','Wafer Presence Sensor 가 ON 되지 않아 Pick 을 완료하지 못했습니다.','robot'); return false; }
  stW(S.who,st.k,null); r.wafer=w; C.pick++;
  log('S','PICK','Pick 완료 : '+w.id+' ← '+st.n+(st.k==='foup'?(' Slot '+r.z):''));
  ok('Pick '+w.id); return true;
};
A.place=()=>{
  if(!guard('place'))return false;
  const r=R(), st=cur();
  if(!r.wafer){ fail('ALM-504','End Effector가 비어 있습니다 (Wafer Presence OFF).','robot'); return false; }
  if(stW(S.who,st.k)){ fail('ALM-505','대상 위치에 이미 웨이퍼가 있습니다 (Double Place).',st.k); return false; }
  const w=r.wafer; stW(S.who,st.k,w); r.wafer=null; C.place++; if(st.k==='aligner') C.plAl++;
  log('S','PLACE','Place 완료 : '+w.id+' → '+st.n+(st.k==='foup'?(' Slot '+r.z):''));
  if(st.k==='pm1'||st.k==='pm2'){        // 챔버에 놓으면 레시피가 곧바로 시작된다
    S[st.k].t=0; S[st.k].run=true;
    log('I','PROC',st.n+' 공정 시작 — '+PMT[st.k]+'초 소요');
  }
  ok('Place '+w.id); return true;
};
A.dock=()=>{
  /* Undock 은 문도 함께 닫는다. 팔이 FOUP 안에 있으면 Door Close 와 똑같이 문이 팔을 친다 —
     예전에는 Door Close 만 막고 Undock 은 통과시켜, 팔이 뻗은 채 FOUP 이 내려갔다. */
  if(S.lp.docked && S.lp.door && extended(S.efem) && ST.efem[S.efem.si].k==='foup'){
    fail('ALM-306','로봇이 FOUP 안에 진입한 상태입니다. Retract 후 Undock 하세요.','lp'); return false; }
  S.lp.docked=!S.lp.docked; if(!S.lp.docked){S.lp.door=false;S.lp.mapped=false;}
  else C.dock++; log('I','LP','FOUP '+(S.lp.docked?'Docking 완료':'Undocking')); return true; };
A.door=()=>{
  if(!S.lp.docked){ fail('ALM-305','Docking 전에는 Door를 열 수 없습니다.','lp'); return false; }
  /* 팔이 FOUP 안에 들어가 있는 동안에는 문을 닫을 수 없다. 문이 팔을 친다.
     (이전 조건은 !S.lp.door 였는데, 문이 닫힌 상태에서는 ALM-301 때문에 FOUP 으로
      Extend 자체가 안 되므로 절대 걸리지 않는 죽은 검사였다.) */
  if(S.lp.door && extended(S.efem) && ST.efem[S.efem.si].k==='foup'){ fail('ALM-306','로봇이 FOUP 안에 진입한 상태입니다. Retract 후 Door를 닫으세요.','lp'); return false; }
  S.lp.door=!S.lp.door; if(!S.lp.door)S.lp.mapped=false;
  log('I','DOOR','Load Port Door '+(S.lp.door?'OPEN':'CLOSE')); return true;
};
A.map=()=>{
  if(!S.lp.door){ fail('ALM-307','Door가 열려야 Slot Mapping이 가능합니다.','lp'); return false; }
  S.lp.map=S.foup.map(s=>!!s.wafer);
  if(S.fault.map){ const mi=Math.min(4,Math.max(0,S.fault.mapSlot|0));
    S.lp.map[mi]=!S.lp.map[mi]; S.lp.mapped=true; C.map++;
    log('W','MAP','Mapping 결과와 실제 웨이퍼 상태에 불일치가 있을 수 있습니다.');
    toast('매핑 결과를 Load Port 탭에서 실제와 비교해 보세요',false); return true; }
  S.lp.mapped=true; C.map++;
  log('S','MAP','Slot Mapping 완료 : '+S.lp.map.map((v,i)=>v?(i+1):'').filter(Boolean).join(',')+'번 슬롯에 웨이퍼 감지'); return true;
};
A.align=()=>{
  if(!S.al.wafer){ fail('ALM-601','Pre-aligner에 웨이퍼가 없습니다.','aligner'); return false; }
  S.al.aligning=true; log('I','ALIGN','웨이퍼 중심 및 Notch 정렬 시작'); return true;
};
A.pump=()=>{
  if(S.ll.atmV){ fail('ALM-308','대기측 Gate Valve가 열린 상태에서 Pump Down 불가.','ll'); return false; }
  if(S.ll.tmV){ fail('ALM-309','진공측 Gate Valve가 열린 상태입니다.','ll'); return false; }
  S.ll.pump=true; S.ll.vent=false; S.ll.et=0; C.pump++;
  log('I','PUMP','Load Lock Pump Down 시작 (목표 1.0E-2 Torr)'); return true;
};
A.vent=()=>{
  if(S.ll.tmV){ fail('ALM-310','진공측 Gate Valve가 열린 상태에서 Vent 불가.','ll'); return false; }
  S.ll.vent=true; S.ll.pump=false; C.vent++; log('I','VENT','Load Lock Vent 시작 (목표 760 Torr)'); return true;
};
A.atmV=()=>{
  if(!S.ll.atmV){
    if(S.ll.p<700){ fail('ALM-311','Load Lock 압력이 대기압이 아닙니다 ('+fmtP()+') — Vacuum Interlock.','ll'); return false; }
    if(S.ll.tmV){ fail('ALM-312','양쪽 Gate Valve 동시 개방 불가.','ll'); return false; }
  } else if(extended(S.efem)&&ST.efem[S.efem.si].k==='ll'){ fail('ALM-313','로봇이 진입한 상태에서 Valve를 닫을 수 없습니다.','ll'); return false; }
  S.ll.atmV=!S.ll.atmV; log('I','VALVE','대기측 Gate Valve '+(S.ll.atmV?'OPEN':'CLOSE')); return true;
};
A.tmV=()=>{
  if(!S.ll.tmV){
    if(S.ll.p>1){ fail('ALM-314','Load Lock 압력이 진공에 도달하지 않았습니다 ('+fmtP()+') — Vacuum Interlock.','ll'); return false; }
    if(S.ll.atmV){ fail('ALM-315','양쪽 Gate Valve 동시 개방 불가.','ll'); return false; }
  } else if(extended(S.vac)&&ST.vac[S.vac.si].k==='ll'){ fail('ALM-316','로봇이 진입한 상태에서 Valve를 닫을 수 없습니다.','ll'); return false; }
  S.ll.tmV=!S.ll.tmV; log('I','VALVE','진공측 Gate Valve '+(S.ll.tmV?'OPEN':'CLOSE')); return true;
};
A.swap=()=>{ S.who=S.who==='efem'?'vac':'efem'; log('I','SEL','제어 대상 : '+(S.who==='efem'?'EFEM Robot (대기)':'Vacuum Robot (진공)')); return true; };
A.estop=()=>{ S.estop=!S.estop;
  if(S.estop){ ['efem','vac'].forEach(k=>{S[k].Rt=S[k].R;S[k].at=S[k].a;S[k].init=false;S[k].homed=false;});
    S.ll.pump=false;S.ll.vent=false; RUNNING=false; if(typeof pStop==='function')pStop('비상정지로 프로그램 중단');
    log('E','E-STOP','비상정지 작동. 모든 축 정지 및 서보 OFF.'); }
  else log('W','E-STOP','비상정지 해제. Reset 후 Initialize부터 다시 시작하세요.');
  return true; };
A.reset=()=>{ S.estop=false;
  S.fault={pump:false,leak:false,map:false,wps:false,grip:false,enc:false,teach:false,mapSlot:1,teachOff:1,encDev:0}; C.fix++;
  log('S','RESET','알람 및 고장 상태 해제. Initialize → Home 순서로 복귀하세요.'); ok('Reset 완료'); return true; };

/* ── 물리 업데이트(압력·정렬·모션) ───────────────────────────── */
function tick(dt){
  ['efem','vac'].forEach(k=>{
    const r=S[k], sp=260*dt, asp=170*dt;
    if(Math.abs(r.R-r.Rt)>0.7) r.R+=Math.sign(r.Rt-r.R)*Math.min(sp,Math.abs(r.Rt-r.R)); else r.R=r.Rt;
    if(Math.abs(r.a-r.at)>0.7) r.a+=Math.sign(r.at-r.a)*Math.min(asp,Math.abs(r.at-r.a)); else r.a=r.at;
  });
  const L=S.ll;
  if(L.pump){
    L.et+=dt;
    if(S.fault.pump){ L.p=Math.max(L.p*Math.pow(0.55,dt),45);
      if(L.et>9){ L.pump=false; fail('ALM-701','Vacuum Timeout : 제한시간(9초) 내 목표 압력 미도달.','ll'); } }
    else if(S.fault.leak){ L.p=Math.max(L.p*Math.pow(0.30,dt),40);
      if(L.et>9){ L.pump=false; fail('ALM-701','Vacuum Timeout : 제한시간(9초) 내 목표 압력 미도달.','ll'); } }
    else { L.p=Math.max(L.p*Math.pow(0.02,dt),0.01); if(L.p<=0.0101){L.p=0.01;L.pump=false;log('S','PUMP','진공 도달 1.0E-2 Torr (Vacuum Sensor ON).');} }
  }
  if(L.vent){ L.p=Math.min(L.p*Math.pow(900,dt)+8*dt,760); if(L.p>=759){L.p=760;L.vent=false;log('S','VENT','대기압 복귀 완료.');} }
  /* 누설이 있으면 배기를 멈춘 사이에 압력이 스스로 올라간다.
     펌프 성능 저하와 증상이 겹치므로, 이것이 둘을 가르는 관찰이 된다. */
  if(S.fault.leak && !L.pump && !L.vent && L.p<760){
    L.p=Math.min(760, L.p + Math.max(1.2, L.p*0.30)*dt); }
  ['pm1','pm2'].forEach(k=>{
    const c=S[k];
    if(!c.run||!c.wafer) return;
    c.t+=dt;
    if(c.t>=PMT[k]){ c.run=false; c.t=PMT[k]; c.wafer.proc=true; C.proc=(C.proc||0)+1;
      log('S','PROC',(k==='pm1'?'Process Chamber1':'Process Chamber2')+' 공정 완료 : '+c.wafer.id+' — 반출할 수 있습니다.'); }
  });
  if(S.al.aligning){
    const w=S.al.wafer; if(!w){S.al.aligning=false;}
    else { let d=(0-w.notch+540)%360-180; if(Math.abs(d)<3){w.notch=0;w.al=true;S.al.aligning=false;C.align++;
        log('S','ALIGN','정렬 완료 : Notch 0°, 중심오차 보정.'); ok('Align 완료'); }
      else w.notch=(w.notch+Math.sign(d)*160*dt+360)%360; }
  }
}

       'Load Lock을 클릭해 설명을 읽으세요. 여기가 대기와 진공이 만나는 유일한 지점입니다.',
       '팔을 뻗어 보려면 Load Port 탭에서 Docking → Door Open을 먼저 하세요. 문이 닫힌 채 Extend를 누르면 Door Interlock(ALM-301)이 막습니다.'],
  qz:[{q:'대기 영역과 진공 영역을 이어주는 장치는?',a:['Pre-aligner','Load Lock','FOUP'],c:1,
       e:'Load Lock은 웨이퍼 크기의 작은 방만 대기↔진공으로 오가게 해서 챔버 진공을 지킵니다.'},
      {q:'FOUP의 역할은?',a:['웨이퍼 방향 정렬','웨이퍼를 밀폐 상태로 운반','웨이퍼 식각'],c:1,
       e:'FOUP은 내부를 질소로 채운 밀폐 용기로, 공장 안을 이동하는 동안 웨이퍼를 외부 공기로부터 지킵니다.'},
      /* 문항 은행 추가분 — 강을 열 때마다 이 중 QZ_SHOW 개를 무작위로 보여 준다 */
      {q:"FOUP이 장비에 도킹하고 문이 열리는 자리는?",a:["Load Port","Pre-aligner","Transfer Chamber"],c:0,
       e:"Load Port가 장비의 현관입니다. 여기서 Docking → Door Open → Mapping이 일어납니다."},
      {q:"Transfer Chamber의 역할은?",a:["웨이퍼 방향을 맞춘다","진공 속에서 진공 로봇이 Load Lock과 공정 챔버 사이를 나른다","FOUP을 보관한다"],c:1,
       e:"진공이 유지되는 이송실입니다. 그 안의 진공 로봇이 챔버로 웨이퍼를 분배합니다."},
      {q:"다음 중 진공 쪽에 있는 장치는?",a:["Pre-aligner","EFEM","Process Chamber"],c:2,
       e:"Load Lock을 경계로 왼쪽(FOUP · EFEM · Pre-aligner)은 대기, 오른쪽(Transfer · Process Chamber)은 진공입니다."},
      {q:"EFEM 안을 깨끗하게 유지하는 방법은?",a:["위에서 아래로 깨끗한 공기를 흘려(다운플로우) 먼지를 밀어낸다","내부를 진공으로 만든다","문을 항상 열어 환기한다"],c:0,
       e:"EFEM은 대기압이지만 필터를 거친 공기를 위에서 아래로 흘려 파티클이 웨이퍼에 앉지 못하게 합니다."}]},
3:{why:'6축 관절 로봇을 떠올릴 필요가 없습니다. 웨이퍼 이송 로봇의 움직임은 R(전진·후진), θ(회전), Z(상하) 셋뿐입니다. 단순한 대신 정확해야 하고, 그래서 순서가 엄격합니다.',
  how:['Initialize와 Home을 먼저 누르세요. 준비가 안 되면 축이 움직이지 않습니다.',
       '◀ Rotate / Rotate ▶ 를 눌러 목표 스테이션을 바꿔보세요. 팔이 도는 것이 보입니다.',
       'Extend는 Pre-aligner 앞에서 하세요. 이 챕터에는 Load Port 탭이 없어 FOUP 앞에서는 문이 닫혀 있어 거부됩니다(ALM-301) — 스테이션마다 뻗을 수 있는 조건이 다릅니다.',
       '▲ Z Up / ▼ Z Down으로 높이를 바꿔보세요. FOUP에서는 이 값이 곧 슬롯 번호입니다.',
       '훈련 탭으로 가서 ① 워밍업부터 ⑤ 정밀 순회까지 다섯 개를 차례로 하세요. 여기가 이 챕터의 본 실습입니다. 시작을 누르면 목표·조작할 탭·완료 조건이 화면에 계속 뜹니다.'],
  qz:[{q:'FOUP 앞에서 Z축이 의미하는 것은?',a:['팔의 길이','몇 번 슬롯을 겨냥하는가','회전 각도'],c:1,
       e:'FOUP은 웨이퍼가 층층이 꽂혀 있으므로 높이(Z)가 곧 슬롯 선택입니다.'},
      {q:'θ축이 하는 일은?',a:['팔을 뻗는다','몸을 돌려 다른 장치를 향한다','웨이퍼를 든다'],c:1,
       e:'θ는 회전축입니다. FOUP ↔ 정렬기 ↔ 로드락으로 방향을 바꿉니다.'},
      /* 문항 은행 추가분 — 강을 열 때마다 이 중 QZ_SHOW 개를 무작위로 보여 준다 */
      {q:"R축이 하는 일은?",a:["팔을 뻗고(Extend) 접는다(Retract)","몸을 돌린다","높이를 바꾼다"],c:0,
       e:"R 전진·후진, θ 회전, Z 상하 — 이송 로봇의 축은 이 셋뿐입니다."},
      {q:"Initialize 없이 바로 Home을 누르면?",a:["정상적으로 Home 된다","ALM-101 — Initialize가 먼저다","ALM-201"],c:1,
       e:"Initialize로 깨우고 Home으로 0점을 잡습니다. 순서가 바뀌면 ALM-101입니다."},
      {q:"상태바의 R 값이 0이다. 무슨 뜻인가?",a:["팔이 최대로 뻗어 있다","팔이 완전히 접힌 수축 위치다","로봇이 꺼져 있다"],c:1,
       e:"R은 수축 위치를 0으로 둔 값입니다. 0이 아니면 팔이 나가 있습니다."},
      {q:"FOUP 앞에서 ▲ Z Up을 누르면 슬롯 번호는?",a:["1 줄어든다(1번 쪽)","1 늘어난다(5번 쪽)","변하지 않는다"],c:0,
       e:"▲ Z Up은 번호를 줄이고, ▼ Z Down은 늘립니다. Z가 곧 슬롯 선택입니다."}]},
4:{why:'수동조작은 자동운전의 기초입니다. 자동 시퀀스도 결국 이 버튼들을 순서대로 누르는 것에 지나지 않습니다. 이 챕터에서는 특히 "뻗은 채로 돌면 안 된다"는 규칙을 몸으로 확인합니다.',
  how:['Load Port 탭에서 Docking을 누르고, 이어서 Door Open을 누르세요.',
       '수동조작 탭에서 FOUP 방향으로 회전한 뒤 Extend를 누르세요.',
       'Retract로 팔을 다시 넣으세요.',
       '일부러 Extend 상태에서 회전을 눌러보세요. 막히는 것이 정상입니다.',
       '훈련 탭으로 가세요. ① 한 바퀴 · ② 막히는 동작 2종 · ③ 네 자리 최소 조작 — 조작 수가 기록으로 남습니다. 마지막 ④ 수행평가는 제한 시간 실기 한 사이클 + 4지선다 퀴즈 10문항(문항 은행 20개 중 매번 무작위)이며, 실기 시간 · 퀴즈 점수 · 총 소요 시간이 기록됩니다.'],
  qz:[{q:'팔을 뻗은 상태에서 회전하면 어떻게 되나?',a:['속도가 느려진다','옆 장치와 충돌해 Collision Interlock이 걸린다','아무 일 없다'],c:1,
       e:'뻗은 팔은 회전 반경 밖으로 나가 있어 벽이나 다른 장치를 칩니다. 그래서 장비가 명령 자체를 거부합니다.'},
      {q:'Door가 닫힌 채 Extend를 누르면?',a:['문이 자동으로 열린다','Door Interlock으로 거부된다','팔이 문을 밀고 들어간다'],c:1,
       e:'ALM-301이 발생합니다. 문을 먼저 열지 않으면 로봇은 절대 진입하지 않습니다.'},
      /* 문항 은행 추가분 — 강을 열 때마다 이 중 QZ_SHOW 개를 무작위로 보여 준다 */
      {q:"다른 스테이션으로 옮겨 갈 때의 기본 리듬은?",a:["편다 → 돈다 → 접는다","접는다 → 돈다 → 편다","돈다 → 편다 → 돈다"],c:1,
       e:"뻗은 채 돌면 충돌합니다. 어디로 가든 접고 → 돌고 → 편다."},
      {q:"팔을 뻗은 채 Z를 움직이면?",a:["ALM-202로 거부된다","정상적으로 움직인다","ALM-401"],c:0,
       e:"편 채 회전(201)과 같은 실수의 다른 얼굴입니다. Retract 후 Z를 움직입니다."},
      {q:"팔이 아직 움직이는 도중에 다른 버튼을 누르면?",a:["ALM-103 — 이동 중에는 새 명령을 받지 않는다","앞 동작이 취소되고 새 동작이 실행된다","두 동작이 동시에 실행된다"],c:0,
       e:"동작이 끝난 뒤 누릅니다. 상태바 숫자가 멈췄는지 보세요."},
      {q:"팔이 FOUP 안에 들어가 있는 동안 Door Close를 누르면?",a:["문이 닫히며 팔을 친다","ALM-306으로 거부된다 — Retract 후 닫는다","팔이 자동으로 접힌다"],c:1,
       e:"인터록은 양방향입니다. 닫힌 문으로 들어갈 수 없고, 들어가 있는 동안 문을 닫을 수도 없습니다."}]},
5:{why:'이송의 최소 단위가 Pick → Transfer → Place입니다. 여기서 중요한 것은 순서입니다. 겨냥하고, 뻗고, 집고, 빼고, 그다음에 돕니다. 이 네 박자를 흐트러뜨리면 반드시 어딘가에서 걸립니다.',
  how:['Load Port 탭에서 Docking → Door Open → Mapping을 순서대로 누르세요.',
       '수동조작에서 FOUP을 향하게 하고 Z축으로 Slot 1을 겨냥한 뒤, Extend → Pick.',
       'Retract 후 Rotate로 Pre-aligner를 향하고, Extend → Place.',
       'Retract하고 Home을 눌러 마무리하세요.',
       '훈련 탭으로 가세요. ① 첫 이송 왕복 · ② 세 장 왕복 시간 재기 — 손에 익을수록 기록이 줄어듭니다.'],
  qz:[{q:'Pick이 가능한 조건은?',a:['팔이 뻗어 있고 대상 위치에 웨이퍼가 있을 때','로봇이 Home에 있을 때','문이 닫혀 있을 때'],c:0,
       e:'Extend된 상태에서만 손이 웨이퍼 아래로 들어갑니다. 그리고 그 자리에 웨이퍼가 실제로 있어야 합니다.'},
      {q:'빈 슬롯에 대고 Pick을 누르면?',a:['빈손으로 그냥 돌아온다','Wafer Presence 알람이 발생한다','다음 슬롯을 자동으로 집는다'],c:1,
       e:'ALM-502가 뜹니다. 로봇 고장이 아니라 겨냥이 틀린 것입니다.'},
      /* 문항 은행 추가분 — 강을 열 때마다 이 중 QZ_SHOW 개를 무작위로 보여 준다 */
      {q:"Pick의 네 박자로 옳은 것은?",a:["겨냥(Z) → Extend → Pick → Retract","Pick → Extend → Retract → 겨냥","Extend → 회전 → Pick → Retract"],c:0,
       e:"겨냥하고, 뻗고, 집고, 빼고 — 회전은 그다음입니다."},
      {q:"빈손으로 Place를 누르면?",a:["ALM-504 — End Effector가 비어 있다","ALM-502","아무 일도 없다"],c:0,
       e:"손 위의 Wafer Presence가 OFF이면 놓을 것이 없으므로 거부됩니다."},
      {q:"웨이퍼를 든 채 또 Pick을 누르면?",a:["두 장을 겹쳐 든다","ALM-501로 거부된다","들고 있던 웨이퍼를 내려놓는다"],c:1,
       e:"손에 이미 웨이퍼가 있으면(ALM-501) 집을 수 없습니다."},
      {q:"이미 웨이퍼가 있는 자리에 Place를 누르면?",a:["ALM-505 Double Place로 거부된다","두 장이 겹쳐 놓인다","자동으로 옆 칸에 놓는다"],c:0,
       e:"놓기 전에 대상 위치가 비었는지 확인합니다."}]},
6:{why:'센서는 장비의 감각기관입니다. 인터록도, 알람도, 자동운전의 조건 분기도 전부 센서 신호 하나하나로 판정됩니다. 이 챕터은 조작할 때마다 어떤 신호가 바뀌는지를 눈으로 붙잡는 것이 목표입니다.',
  how:['센서 모니터 탭을 열어두면 신호가 실시간으로 바뀝니다. Pick 직전과 직후에 Wafer Presence Sensor를 비교하세요.',
       'Home 상태에서 Extend를 하면 Home Sensor가 꺼지는 것을 확인하세요.',
       'Z축을 끝까지 올려 Limit Sensor 알람(ALM-401)을 일부러 내보세요.',
       '훈련 탭으로 가세요. ① 신호 만들기(조작 14회·알람 0) · ② 한계 신호 3종(60초·다른 알람 금지) · ③ 무알람 순회(10개·여유 6회) · ④ 신호 예측(누르기 전에 고른다) — 여기가 이 챕터의 본 실습입니다.',
       '다 끝났으면 위의 🏭 버튼으로 자동차 공장 로봇 셋업을 열어 보세요. 이름만 다를 뿐(마스터링·소프트리밋·파트 센서·절대형 엔코더·안전문) 같은 다섯 신호로 돌아갑니다.'],
  qz:[{q:'Wafer Presence Sensor가 보는 것은?',a:['FOUP 안의 웨이퍼 수','End Effector 위에 웨이퍼가 있는지','챔버 압력'],c:1,
       e:'로봇 손 위에 웨이퍼가 실려 있는지를 봅니다. Pick 성공 여부를 판정하는 신호입니다.'},
      {q:'Home Sensor가 ON 되는 조건은?',a:['전원이 켜지면','로봇이 기준 위치로 완전히 복귀했을 때','웨이퍼를 들었을 때'],c:1,
       e:'Home 실행 후 팔이 수축 위치에 도달해야 켜집니다. 뻗으면 꺼집니다.'},
      /* 문항 은행 추가분 — 강을 열 때마다 이 중 QZ_SHOW 개를 무작위로 보여 준다 */
      {q:"Limit Sensor가 막는 것은?",a:["Z가 1~5 범위를 넘어 움직이는 것 (ALM-401)","팔을 편 채 회전하는 것","문이 닫힌 채 진입하는 것"],c:0,
       e:"기구가 부딪히기 전에 '여기서 멈추라'고 알려 주는 신호입니다."},
      {q:"Encoder가 재는 것은?",a:["웨이퍼 유무","축의 회전 각도(θ)","Load Lock 압력"],c:1,
       e:"구멍 난 원판이 지나가는 빛을 세어 각도를 계산합니다. 명령 각도와 비교해 위치를 판정합니다."},
      {q:"Position Sensor가 '정위치'로 켜지는 조건은?",a:["전원이 켜지면 항상","θ가 스테이션 각도와 3° 이내이고 멈춰 있을 때","웨이퍼를 들고 있을 때"],c:1,
       e:"3°를 넘게 어긋난 채 Extend하면 ALM-405(Position Interlock)입니다."},
      {q:"Pick이 성공한 순간 End Effector의 Wafer Presence는?",a:["ON → OFF","OFF → ON","변하지 않는다"],c:1,
       e:"손 위에 웨이퍼가 실리면 ON이 됩니다. Place하면 다시 OFF입니다."}]},
7:{why:'Load Port는 반드시 세 단계로만 열립니다. Docking → Door Open → Slot Mapping. 이 순서는 공장 공기가 웨이퍼에 닿지 않게 하려고 만들어진 것이고, 하나라도 건너뛰면 장비가 거부합니다.',
  how:['먼저 순서를 일부러 어겨보세요. Docking 없이 Door Open(ALM-305), Door 닫힌 채 Extend(ALM-301).',
       '이제 Docking → Door Open → Mapping을 순서대로 수행하세요.',
       'Load Port 탭의 표에서 매핑 신호와 실제 웨이퍼를 나란히 비교하세요. 도면의 FOUP 을 누르면 실물 설명이 뜨고 미션 ③이 체크됩니다.',
       '훈련 탭으로 가세요. 슬롯 배치가 매번 바뀌므로 직접 매핑해 읽어야 하고, ③은 센서가 틀린 값을 내는 상태에서 어긋난 칸을 찾습니다.'],
  qz:[{q:'Slot Mapping을 하는 이유는?',a:['웨이퍼를 세척하려고','작업 전에 어느 칸에 웨이퍼가 있는지 목록을 확보하려고','압력을 낮추려고'],c:1,
       e:'로봇은 눈이 없습니다. 빈 칸 Pick이나 이중 Place를 막으려면 미리 세어둬야 합니다.'},
      {q:'매핑 결과와 실제가 다르면 무엇이 문제인가?',a:['Mapping Error — 이 목록으로 작업하면 사고가 난다','문제없다','압력 센서 고장'],c:0,

       e:'알람 문구에 막힌 이유가 그대로 적혀 있습니다. 다시 누르는 것은 원인 파악이 아닙니다.'},

9:{why:'웨이퍼 가장자리에는 V자 홈(Notch)이 하나 있고, 그것이 웨이퍼의 12시 방향입니다. 이전 공정에서 그린 패턴이 모두 이 기준을 따르기 때문에, 정렬 없이 챔버에 넣으면 패턴이 어긋나 제품 전체가 불량이 됩니다.',

       '훈련 탭으로 가세요. ① 정렬 한 바퀴 · ② 세 장 모두 정렬 — 어떤 순서가 빠른지는 12강에서 프로그램으로 다시 만납니다.'],

10:{why:'공정 챔버는 진공입니다. 문을 그냥 열면 진공이 깨져 복구에 몇 시간이 걸립니다. Load Lock은 웨이퍼 크기의 작은 방만 대기↔진공을 오가게 해서 이 손실을 없앱니다. 그래서 밸브 두 개는 절대 동시에 열리지 않습니다.',

       '훈련 탭으로 가세요. 대기↔진공 한 바퀴를 알람 없이 돌고, 인터록 3종을 걸어 보고, 배기 시간을 재 둡니다 — 그 값이 14강 고장 진단의 기준선입니다.'],
  qz:[{q:'진공측 Gate Valve가 열리는 조건은?',a:['압력 1 Torr 이하 + 대기측 밸브 닫힘','언제든지','압력 760 Torr'],c:0,
       e:'양쪽 동시 개방은 공장 공기가 챔버까지 밀려 들어가는 사고로 이어집니다.'},
      {q:'Pump Down이 시간 내에 끝나지 않으면?',a:['Vacuum Timeout 알람','자동으로 다시 시도','정상 진행'],c:0,
       e:'ALM-701입니다. 명령이 틀린 것이 아니라 펌프 성능·누설 같은 설비 문제입니다.'},
      /* 문항 은행 추가분 — 강을 열 때마다 이 중 QZ_SHOW 개를 무작위로 보여 준다 */
      {q:"대기측(ATM) Gate Valve가 열리는 조건은?",a:["압력 700 Torr 이상 + 진공측 밸브 닫힘","압력 1 Torr 이하","언제든지"],c:0,
       e:"진공 상태에서 열면 ALM-311, 진공측이 열려 있으면 ALM-312입니다."},

       e:"대기측이 열려 있으면 ALM-308, 진공측이 열려 있으면 ALM-309입니다."},
      {q:"진공측 밸브가 열린 채 Vent를 누르면?",a:["정상적으로 대기압이 된다","ALM-310 — Transfer Chamber에 질소가 들어가므로 거부","밸브가 자동으로 닫힌다"],c:1,

      {q:'진공 로봇이 담당하는 구간은?',a:['FOUP ↔ 정렬기','Load Lock ↔ 공정 챔버','공장 복도'],c:1,
       e:'대기 로봇은 로드락까지, 진공 로봇은 로드락부터입니다.'},
      /* 문항 은행 추가분 — 강을 열 때마다 이 중 QZ_SHOW 개를 무작위로 보여 준다 */

       e:"배기 → 진공측 밸브 열기 → 진입 순서입니다."}]},
12:{why:'자동 운전은 마법이 아닙니다. 사람이 누르던 순서를 그대로 목록으로 적어둔 것뿐입니다. 다만 사람과 달리 프로그램은 상황을 눈으로 보지 못하므로, 중간중간 CHECK로 조건을 확인해야 합니다.',

  qz:[{q:'CHECK 블록의 역할은?',a:['속도를 조절한다','조건이 맞지 않으면 그 자리에서 시퀀스를 정지시킨다','로그를 지운다'],c:1,

      {q:'MOVE 블록 앞에 RETRACT가 필요한 이유는?',a:['속도 때문','뻗은 채 회전하면 충돌하므로','전력 절약'],c:1,
       e:'회전 전에는 반드시 팔을 넣어야 합니다. 수동조작과 같은 규칙입니다.'},

       e:"밸브 블록은 토글입니다. 열기 · 닫기를 짝으로 넣습니다."},

let QZP={};
function shuffled(n){ const p=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [p[i],p[j]]=[p[j],p[i]]; } return p; }

   setup:()=>log('I','DRILL','장비를 초기 상태로 맞췄습니다. Load Lock 을 거쳐 챔버까지 보내세요.'),
   goals:[

    {t:'공정 중에 Pick 을 시도해 반출 인터록을 확인한다',     k:()=>(C.ilk['ALM-601']||0)>(DR.ilk0['ALM-601']||0)},
    {t:'공정이 끝난 웨이퍼를 반출한다',                       k:()=>procCount()>=1&&!S.pm1.run&&!S.pm2.run&&!(S.pm1.wafer||S.pm2.wafer)}
   ]},
  {id:'ch11-both', use:['port','manual','vac'], type:'goal', title:'② 두 챔버를 동시에 돌린다', record:'time',
   desc:'챔버가 둘인 이유는 동시에 돌리기 위해서입니다. 두 챔버가 같이 공정 중인 순간을 만드세요. 한 장을 끝까지 처리하고 다음 장을 시작하면 만들 수 없습니다.',
   tip:'첫 장을 챔버에 넣고 기다리지 마세요. 공정이 도는 동안 다음 장을 Load Lock 으로 올려 두는 것이 요령입니다.',
   setup:()=>log('I','DRILL','장비를 초기 상태로 맞췄습니다.'),
   goals:[
    {t:'한 챔버에서 공정을 시작한다',           k:()=>S.pm1.run||S.pm2.run},
    {t:'두 챔버가 동시에 공정 중인 상태를 만든다', k:()=>S.pm1.run&&S.pm2.run}
   ]},
  {id:'ch11-two', use:['port','manual','vac'], type:'goal', title:'③ 두 장 처리 — 순서가 시간을 바꾼다', record:'time',
   desc:'웨이퍼 두 장의 공정을 모두 끝내세요. 시간이 기록으로 남습니다. 어느 챔버로 먼저 보내느냐에 따라 총 시간이 달라집니다.',
   tip:'PM1 은 10초, PM2 는 22초입니다. 긴 쪽을 먼저 채워 두면 그 시간 동안 짧은 쪽을 돌릴 수 있습니다. 반대로 하면 마지막에 22초를 통째로 기다립니다.',
   setup:()=>log('I','DRILL','장비를 초기 상태로 맞췄습니다. 두 장의 공정을 모두 끝내세요.'),
   goals:[
    {t:'첫 장의 공정을 끝낸다', k:()=>procCount()>=1},
    {t:'둘째 장의 공정을 끝낸다', k:()=>procCount()>=2}
   ]}
 ],

 14:[
  {id:'ch14-pair', use:['vac','sensor'], type:'value', title:'① 증상이 같은 둘을 가른다', record:'ops', maxWrong:1,
   desc:'배기가 목표 압력에 닿지 않습니다. 원인은 펌프 성능 저하일 수도, 진공 누설일 수도 있습니다. 증상만으로는 갈리지 않으므로 관찰을 하나 더 해야 합니다.',
   tip:'Load Lock 탭에서 Pump Down 을 눌러 보세요. 목표에 닿지 못하는 것까지는 둘이 같습니다. 그다음이 갈림길입니다.',
   setup:()=>newCase(['pump','leak']),
   qs:[
    {q:'배기를 시도한 뒤, 원인은 둘 중 어느 쪽입니까?',
     opts:[['pump','펌프 성능 저하'],['leak','진공 누설']],
     need:()=>C.pump>=1, needMsg:'먼저 Pump Down 을 눌러 배기를 시도하세요',
     a:()=>faultActive()[0]},
    {q:'두 원인을 가르는 관찰은 무엇입니까?',
     opts:[['stop','배기를 멈추고 압력이 스스로 오르는지 본다'],
           ['vent','Vent 를 눌러 대기압까지 올려 본다'],

           ['home','로봇을 Home 으로 보내 본다']],
     a:()=>'stop'}

  {id:'ch14-one', use:['port','manual','vac','sensor'], type:'value', title:'② 무엇인지 모르는 고장 하나', record:'ops', maxWrong:1,
   desc:'일곱 가지 중 하나가 몰래 주입됩니다. 무엇인지 알려 주지 않습니다. 평소처럼 조작해 보고 어디서 막히는지, 어떤 센서가 이상한지로 좁히세요. 조작 횟수가 기록으로 남습니다.',
   tip:'순서대로 해보세요. Docking → Door → Mapping → Home → 회전 → Extend → Pick → 이송. 막히는 지점이 곧 후보를 좁힙니다. 알람 코드는 원인이 아니라 현상을 말한다는 점에 주의하세요.',
   setup:()=>newCase(['pump','leak','map','wps','grip','enc','teach']),
   qs:[

    {q:'그 판단의 근거가 된, 이상을 보인 센서는?',
     opts:[['pressure','Pressure / Vacuum Sensor'],['mapping','Slot Mapping'],
           ['presence','Wafer Presence'],['position','Position Sensor'],['home','Home Sensor']],

  {id:'ch14-run', use:['port','manual','vac','sensor'], type:'value', title:'③ 연속 진단 세 건', record:'ops', maxWrong:2,
   desc:'고장을 하나 맞히면 장비가 초기화되고 다음 고장이 들어옵니다. 세 건을 연달아 맞히세요. 적은 조작으로 찾을수록 좋은 기록입니다.',
   tip:'매번 처음부터 다 해볼 필요는 없습니다. 가장 많은 후보를 한 번에 지우는 관찰이 무엇인지 생각하세요 — 그것이 진단의 실력입니다.',

    {q:'3건째 — 주입된 고장은?', opts:F_OPTS, a:()=>faultActive()[0],

 6:[
  /* 예전 목표는 Presence ON → Home OFF → Presence OFF → Home ON 네 개였다. Pick 은 팔을 뻗은
     상태에서만 되므로 Presence 가 켜지는 순간 Home 은 이미 OFF 이고, 2단계가 저절로 넘어갔다 —
     "어떤 조작이 어떤 신호를 바꾸나"를 따로 볼 기회가 없었다. 웨이퍼를 든 채 한 번 넣고(Home ON)
     다시 뻗게(Home OFF) 해서 두 신호를 떼어 본다. Pick 하려면 문도 열어야 하므로 Load Port 탭도 쓴다. */
  /* 실패 조건이 없어 아무렇게나 눌러도 끝나던 훈련 — 최단 12회이므로 14회 상한, 알람 0회. */
  {id:'ch6-make', use:['manual','port','sensor'], type:'goal', title:'① 신호 만들기', record:'ops', maxOps:14, maxAlarm:0,
   setup:()=>log('I','DRILL','장비를 초기 상태로 맞췄습니다. Initialize · Home 부터 시작하세요.'),
   desc:'센서는 스스로 켜지지 않습니다. 어떤 조작이 어떤 신호를 바꾸는지 손으로 확인합니다. 다섯 가지 상태를 순서대로 만드세요. 조작 14회(최단 12회) 안에, 알람 없이.',
   tip:'센서 모니터 탭을 열어 두고 조작하세요. Home Sensor 는 "원점 복귀했고 팔이 들어와 있을 때"만 ON 입니다. FOUP 에서 집으려면 Load Port 탭에서 Docking · Door Open 을 먼저 합니다. 웨이퍼는 1~3번 칸에 있습니다(도면의 FOUP 참고). Slot Mapping 은 7강에서 배웁니다 — 현장에서는 매핑으로 목록을 만든 뒤 집지만, 이 시뮬은 매핑 없이도 집힙니다.',
   goals:[
    {t:'Wafer Presence (End Effector) 를 ON 으로 만든다 (Pick)',        k:()=>!!R().wafer},
    {t:'웨이퍼를 든 채 팔을 넣어 Home Sensor 를 ON 으로 (Retract)',     k:()=>{const r=R();return !!r.wafer&&r.homed&&r.R<=RET+1;}},
    {t:'웨이퍼를 든 채 다시 뻗어 Home Sensor 를 OFF 로 (Extend)',       k:()=>{const r=R();return !!r.wafer&&!(r.R<=RET+1);}},
    {t:'Wafer Presence 를 다시 OFF 로 만든다 (Place)',                   k:()=>!R().wafer},
    {t:'Home Sensor 를 다시 ON 으로 되돌린다 (Retract)',                 k:()=>{const r=R();return r.homed&&r.R<=RET+1;}}
   ]},
  /* 팁대로 누르면 20초에 끝나던 훈련 — 60초 제한에, 지정한 셋 외의 알람(101·102·201 …)이 하나라도 나면 실패.
     "조건을 읽고 누른다"가 이 훈련의 본뜻이라 엉뚱한 알람은 곧 조건을 안 읽은 것이다. */
  {id:'ch6-limit', use:['manual','port','sensor'], type:'codes', title:'② 한계와 조건 신호 3종', record:'time',
   codes:['ALM-401','ALM-301','ALM-203'], limitSec:60, onlyCodes:true,
   setup:()=>log('I','DRILL','장비를 초기 상태로 맞췄습니다.'),
   desc:'센서가 "안 된다"고 말하는 세 가지 경우를 직접 만들어 봅니다. 60초 안에 세 알람을 띄우되, 그 밖의 알람(Initialize·Home 안 하고 누른 101·102 포함)이 하나라도 나면 실패입니다.',
   tip:'Z1 에서 ▲ Up (또는 Z5 에서 ▼ Down) 하면 Limit(401), 문을 닫은 채 FOUP 으로 Extend 하면 Door(301), 팔을 넣은 채 Pick 하면 "팔이 스테이션 안에 없다"(203) 입니다.'},
  {id:'ch6-clean', use:['manual'], type:'tour', n:10, slack:6, maxAlarm:0, record:'ops', title:'③ 무알람 순회',
   desc:'목표 10개를 알람 한 번 없이, 최단 조작 수 + 6회 안에 돌아옵니다. 알람이 나거나 조작이 넘치면 그 자리에서 실패입니다.',
   tip:'누르기 전에 지금 센서가 무엇을 허락하는지 먼저 보세요. 조작 여유가 6회뿐이라 회전 방향도 짧은 쪽으로 골라야 합니다.'},
  /* ④ 예측 훈련 — 센서 모니터를 보고 따라 하는 것과, 누르기 전에 머릿속으로 신호를 그리는 것은 다른 능력이다.
     장비가 자세를 잡아 주고, 학생은 "이 버튼을 누르면 어떤 신호가 바뀌나"를 먼저 고른 뒤 실행해 맞춘다.
     수동 조작은 금지(스크립트가 깨진다). 오답 3회까지. */
  {id:'ch6-predict', use:['sensor'], type:'predict', title:'④ 신호 예측 — 누르기 전에 맞힌다', record:'wrong', maxWrong:3, n:10,
   desc:'장비가 자세를 잡아 주면, 버튼을 누르기 전에 "어떤 신호가 바뀔지"를 먼저 고릅니다. 고른 뒤 실행해 맞혔는지 봅니다. 10문항, 오답 3회까지. 이 훈련 중에는 수동 조작을 하지 않습니다.',
   tip:'센서 모니터 탭을 옆에 두고 지금 상태를 본 뒤 고르세요. "바뀌는 것 없음"도 답이 될 수 있고, 거부되는 조작은 거부만 고릅니다. 값이 변하는 것(Encoder)과 켜지고 꺼지는 것을 구분하세요.',
   setup:()=>{ const r=S.efem; r.init=true; r.homed=true; S.lp.docked=true; S.lp.door=true; r.si=0; r.z=3;
     log('I','DRILL','장비 준비 — Initialize·Home 완료, FOUP Docking·Door Open, Z 3 (W3 있음). 훈련이 자세를 옮길 때는 알려 줍니다.'); },
   rounds:[
    {act:'ext',  label:'Extend', ans:['home'],
     why:'팔이 나가면 Home Sensor 가 꺼집니다. Position 은 이동 중에만 OFF 였다가 도착하면 다시 정위치라 "바뀜"이 아닙니다.'},
    {act:'pick', label:'Pick', ans:['presence'],
     why:'손 위에 웨이퍼가 실리면 Wafer Presence 가 ON. 팔은 그대로 뻗어 있으니 Home 은 OFF 그대로입니다.'},
    {act:'ret',  label:'Retract', ans:['home'],
     why:'팔이 들어오면 Home Sensor 가 다시 켜집니다. 웨이퍼는 손에 있으니 Presence 는 ON 그대로.'},
    {act:'rotR', label:'Rotate ▶ (Pre-aligner 쪽)', ans:['enc'],
     why:'회전은 Encoder 값(θ)만 바꿉니다. 수축한 채 돌면 Home 은 ON 유지, 도착하면 Position 은 다시 정위치입니다.'},
    {act:'ext',  label:'Extend (Pre-aligner 앞, 웨이퍼 든 채)', ans:['home'],
     why:'든 채 뻗어도 꺼지는 것은 Home 뿐입니다. Presence 는 손 위 웨이퍼 유무라 뻗는 것과 무관합니다.'},
    {act:'place',label:'Place', ans:['presence'],
     why:'웨이퍼를 내려놓으면 손 위가 비니 Presence 가 OFF. Home 은 뻗어 있어 OFF 그대로.'},
    {act:'rotL', label:'Rotate ◀ (팔을 뻗은 채)', ans:['reject'],
     why:'뻗은 채 회전은 ALM-201 Collision Interlock 으로 거부됩니다. 거부되면 아무 신호도 바뀌지 않습니다 — 알람만 남습니다.'},
    {act:'ret',  label:'Retract', ans:['home'],
     why:'팔을 넣으면 Home ON. 빈손이라 Presence 는 OFF 그대로.'},
    {pre:()=>{ S.efem.z=1; }, preMsg:'훈련이 Z 를 1 로 옮겼습니다 (▲ 두 번).',
     act:'up', label:'▲ Z Up (Z1 에서)', ans:['limit','reject'],
     why:'Z 는 1~5 뿐이라 ALM-401 로 거부되고, Limit 줄이 잠깐 빨갛게 "거부"를 보여 줍니다. 소프트 리밋이 첫 겹입니다.'},
    {pre:()=>{ S.lp.door=false; S.lp.mapped=false; const r=S.efem; r.si=0; r.a=r.at=ST.efem[0].ang; },
     preMsg:'훈련이 Load Port Door 를 닫고 로봇을 FOUP 앞으로 돌려 놓았습니다 (팔 수축).',
     act:'ext', label:'Extend (FOUP 쪽, 문 닫힘)', ans:['reject'],
     why:'문이 닫혀 있으면 ALM-301 Door Interlock. Door Sensor 는 이미 CLOSE 였으니 "바뀜"이 아니고, 거부라 Home 도 그대로입니다.'}
   ]}
 ],

 7:[
  {id:'ch7-order', use:['port'], type:'goal', title:'① 장착과 해제 순서', record:'ops',
   setup:()=>log('I','DRILL','FOUP 을 내린 상태에서 시작합니다.'), 
   desc:'Load Port 는 정해진 순서로만 열리고, 닫을 때도 순서가 있습니다. 한 바퀴를 알람 없이 돌아오세요.',
   tip:'Docking → Door Open → Mapping. 되돌릴 때는 반대입니다. 로봇이 들어가 있으면 문이 닫히지 않습니다.',
   goals:[
    {t:'FOUP 을 Docking 한다',            k:()=>S.lp.docked},
    {t:'Door 를 연다',                    k:()=>S.lp.door},
    {t:'Slot Mapping 을 실행한다',        k:()=>S.lp.mapped},
    {t:'Door 를 닫는다',                  k:()=>!S.lp.door},
    {t:'Undock 으로 FOUP 을 내린다',      k:()=>!S.lp.docked}
   ]},
  {id:'ch7-read', use:['port'], type:'value', title:'② 매핑 판독', record:'wrong', maxWrong:2,
   desc:'FOUP 에 웨이퍼가 어느 칸에 들었는지는 시작할 때마다 새로 정해집니다. 직접 매핑해서 읽어내세요.',
   tip:'Load Port 탭에서 Docking → Door Open → Mapping 을 한 뒤, 표에서 감지된 칸을 읽습니다.',
   setup:()=>{
     const n=2+Math.floor(Math.random()*3);
     const idx=[0,1,2,3,4].sort(()=>Math.random()-0.5).slice(0,n).sort((a,b)=>a-b);
     S.foup=[1,2,3,4,5].map(i=>({slot:i,
       wafer: idx.includes(i-1) ? {id:'W'+i, al:false, notch:(i*47)%360} : null}));
   },
   qs:[
    {q:'웨이퍼가 감지된 슬롯 번호를 작은 것부터 쉼표로 적으세요.', ph:'예: 1,3,4',
     need:()=>S.lp.mapped, needMsg:'먼저 Mapping 을 실행하세요',
     a:()=>S.foup.filter(x=>x.wafer).map(x=>x.slot).join(',')},
    {q:'비어 있는 슬롯은 모두 몇 칸입니까?', ph:'숫자',
     need:()=>S.lp.mapped, needMsg:'먼저 Mapping 을 실행하세요',

function drillStart(id){

function newTargetFrom(si,z){

    for(let i=0;i<n;i++){ if(used[i])continue; used[i]=1; acc.push(list[i]); perm(); acc.pop(); used[i]=0; }

function predBegin(){
  const d=DR.d, rd=d.rounds[DR.idx];
  DR.pr={phase:'pre', sel:[], before:null, changed:null, right:null};
  if(rd.pre){ try{ rd.pre(); }catch(e){} if(rd.preMsg) log('I','DRILL',rd.preMsg); }
}
function predTick(){
  const d=DR.d, pr=DR.pr; if(!pr) return;
  if(OPS-DR.ops0>0){ drillStop('예측 훈련 중에는 수동 조작을 하지 않습니다 — 훈련이 버튼을 대신 누릅니다'); return; }
  const r=S.efem;
  if(pr.phase==='pre'&&!busy(r)){ pr.phase='ask'; setTimeout(()=>{ try{ renderPane(); }catch(e){} },0); return; }
  if(pr.phase==='run'&&!busy(r)){
    const a=predSnap(), b=pr.before, ch=[];
    ['presence','home','limit','position','door','enc'].forEach(k=>{ if(a[k]!==b[k]) ch.push(k); });
    if(a.alarm>b.alarm) ch.push('reject');
    pr.changed=ch;
    const want=[...pr.sel].sort().join(), got=[...ch].sort().join();
    pr.right=(want===got);
    if(!pr.right) DR.wrong++;
    log(pr.right?'S':'W','DRILL','예측 '+(DR.idx+1)+'/'+d.rounds.length+' — '+(pr.right?'정답':'오답')+' (바뀐 것: '+(ch.map(k=>PRED_NAME[k]).join(', ')||'없음')+')');
    pr.phase='result';
    if(d.maxWrong!==undefined&&DR.wrong>d.maxWrong){ drillStop('오답 허용 횟수('+d.maxWrong+'회)를 넘었습니다'); return; }
    setTimeout(()=>{ try{ renderPane(); }catch(e){} },0);
  }
}
function predToggle(k){ const pr=DR.pr; if(!pr||pr.phase!=='ask') return;
  /* 거부되면 다른 신호는 안 바뀐다 — 단 Limit 줄은 ALM-401 거부 때 빨갛게 반응하므로 '거부'와 함께 고를 수 있다. */
  if(k==='reject'){ pr.sel=pr.sel.includes('reject')?pr.sel.filter(x=>x!=='reject'):pr.sel.filter(x=>x==='limit').concat('reject'); return; }
  if(k!=='limit') pr.sel=pr.sel.filter(x=>x!=='reject');
  pr.sel=pr.sel.includes(k)?pr.sel.filter(x=>x!==k):pr.sel.concat(k); }
function predRun(){ const d=DR.d, pr=DR.pr; if(!pr||pr.phase!=='ask') return;
  const rd=d.rounds[DR.idx]; pr.before=predSnap(); pr.phase='run';
  try{ A[rd.act](); }catch(e){} }
function predNext(){ const d=DR.d, pr=DR.pr; if(!pr||pr.phase!=='result') return;
  DR.idx++; if(DR.idx>=d.rounds.length){ drillFinish(); DR.pr=null; return; } predBegin(); }

/* 판독형 훈련 — 학생이 장비를 읽고 답을 적는다 */
function drillAnswer(text){
  const d=DR.d; if(!d||d.type!=='value') return;
  const q=d.qs[DR.qi];
  if(q.need){ let okNeed=false; try{ okNeed=!!q.need(); }catch(e){}
    if(!okNeed){ DR.fb='아직 답할 수 없습니다 — '+(q.needMsg||'먼저 장비에서 측정하세요'); return; } }

  const norm=v=>String(v).replace(/\s+/g,'').replace(/[·/|]/g,',').replace(/,+/g,',').replace(/^,|,$/g,'');
  let right=false, want;
  try{ want=q.a(); }catch(e){ want=''; }
  if(q.tol!==undefined){
    const g=parseFloat(String(text).replace(/[^0-9.+-eE]/g,''));
    right = isFinite(g) && Math.abs(g-Number(want))<=q.tol;
  } else {
    right = norm(text).toLowerCase()===norm(want).toLowerCase();
  }

  if(right){
    DR.fb=''; DR.qi++;
    log('S','DRILL','판독 정답 ('+DR.qi+' / '+d.qs.length+')');
    if(DR.qi>=d.qs.length){ drillFinish(); return; }
    if(q.after){ try{ q.after(); }catch(e){} }
  } else {
    DR.wrong++;
    DR.fb='오답입니다. 다시 읽어 보세요. (오답 '+DR.wrong+'회'+(d.maxWrong!==undefined?' / 허용 '+d.maxWrong:'')+')';
    log('W','DRILL','판독 오답 — 입력 "'+text+'"');
    if(d.maxWrong!==undefined && DR.wrong>d.maxWrong) drillStop('오답 허용 횟수('+d.maxWrong+'회)를 넘었습니다');
  }
}
function examText(r){
  return '실기 '+(r.actOk?'통과 '+fmtSec(r.actSec):'시간 초과 ('+r.steps+' / '+r.nSteps+' 단계)')+
         ' · 알람 '+r.actAlarm+'회 · 퀴즈 '+r.score+' / '+r.nq+' ('+fmtSec(r.quizSec)+') · 총 '+fmtSec(r.total);
}
function drillFinish(){
  const d=DR.d, sec=drillElapsed(), ops=OPS-DR.ops0;
  setTimeout(()=>{ try{ renderStatus(); }catch(e){} },0);
  DR.done[d.id]=true;
  if(d.record==='time'&&d.type!=='exam'){ const b=DR.best[d.id]; if(b===undefined||sec<b) DR.best[d.id]=sec; }
  if(d.record==='ops'){ const b=DR.best[d.id]; if(b===undefined||ops<b) DR.best[d.id]=ops; }
  if(d.record==='wrong'){ const b=DR.best[d.id]; if(b===undefined||DR.wrong<b) DR.best[d.id]=DR.wrong; }
  if(d.type==='exam'){
    /* 수행평가 결과 — 실기 통과 여부·시간·알람, 퀴즈 점수·시간, 총 소요 시간 */
    const ex=DR.ex;
    const r={actOk:ex.actOk, actSec:ex.actSec, actAlarm:ex.actAlarm, steps:DR.idx, nSteps:d.goals.length,
             score:ex.score, nq:ex.qs.length, quizSec:ex.quizSec, total:sec, slot:ex.slot};
    DR.exLast[d.id]=r;
    if(r.actOk){ const b=DR.best[d.id]; if(b===undefined||sec<b) DR.best[d.id]=sec; }   // 최고 기록은 실기 통과한 회차만
    const txt=examText(r);
    log('S','DRILL',d.title+' 종료 — '+txt);
    ok('수행평가 종료 — 퀴즈 '+r.score+' / '+r.nq);
    DR.msg='수행평가 종료 · '+txt;
    DR.d=null; DR.tgt=null; DR.ex=null;
    return;
  }
  log('S','DRILL',d.title+' 완료 — '+sec+'초 · 조작 '+ops+'회');
  ok(d.title+' 완료');
  DR.msg=d.title+' 완료 · '+sec+'초 · 조작 '+ops+'회';
  DR.d=null; DR.tgt=null;
}

/* 센서 줄의 상태값: true(정상·ON) · false(OFF) · 'warn'(경계) · 'err'(방금 거부). 점 색이 따라간다. */
const SDOT={true:'var(--ok)',false:'#39536b',warn:'var(--warn)',err:'var(--bad)'};
const sdot=v=>SDOT[v===true?'true':v===false?'false':v];
const stxt=v=>v===true?'var(--ok)':v==='warn'?'var(--warn)':v==='err'?'var(--bad)':'var(--tx2)';
/* 이 챕터 범위(scope)에 있는 장치인가 — 범위 밖 장치의 센서 줄은 숨긴다.
   6강에서 Pressure·Vacuum·PM 줄이 상수로 떠 있어 "주인공 신호"가 묻혔다. */
function inScope(...keys){ const sc=WEEK[WK].scope; return sc.includes('all')||keys.some(k=>sc.includes(k)); }
function sensors(){
  const r=R(), st=cur();
  /* Limit 줄은 예전에 r.z>=1&&r.z<=5 였다 — Z 는 범위를 넘기 전에 거부되므로 언제나 ON 이었고,
     6강 제목 센서가 화면에서 아무 반응이 없었다. 상·하한에 서면 경계(주황), 한계 밖 이동이
     거부된 직후 2.5초는 빨간 'ALM-401' 로 보여 "소프트 리밋이 막았다"를 눈으로 잡게 한다. */
  const limRecent=S.limHit&&(Date.now()-S.limHit)<2500;
  const limState=limRecent?'err':((r.z<=1||r.z>=5)?'warn':true);
  const limText=limRecent?'ALM-401 — 한계 밖 이동 거부'
    :(r.z<=1?'Z = 1 / 5 · 상한 (▲ 더 못 감)':r.z>=5?'Z = 5 / 5 · 하한 (▼ 더 못 감)':'Z = '+r.z+' / 5 · 범위 안');
  const rows=[
   ['Wafer Presence (End Effector)', !!r.wafer&&!S.fault.wps, S.fault.wps?'신호 없음':(r.wafer?r.wafer.id:'없음')],
   ['Slot Mapping', S.lp.mapped, S.lp.mapped?S.lp.map.map((v,i)=>v?(i+1):'-').join(' '):'미실행', 'lp'],
   ['Home Sensor', r.homed&&r.R<=RET+1, r.homed?(r.R<=RET+1?'ON':'전진중'):'OFF'],
   ['Limit Sensor (Z)', limState, limText],
   ['Position Sensor', !busy(r)&&Math.abs(posDev(r))<=3,
     busy(r)?'이동중':(Math.abs(posDev(r))>3 ? st.n+' 편차 '+posDev(r).toFixed(0)+'°' : st.n+' 정위치')],
   ['Encoder (θ)', true, r.a.toFixed(0)+'°'],
   ['Door Sensor', S.lp.door, S.lp.door?'OPEN':'CLOSE', 'lp'],
   ['Pressure Sensor', S.ll.p<700, fmtP(), 'll','vac'],
   ['Vacuum Sensor', S.ll.p<1, S.ll.p<1?'진공 도달':'미도달', 'll','vac'],
   ['Collision Sensor', !(extended(r)&&busy(r)&&Math.abs(r.a-r.at)>1), '정상'],
   ['PM1 Status', !S.pm1.run,
     S.pm1.run ? ('공정 중 — 남은 '+pmLeft('pm1').toFixed(0)+'초')
               : (S.pm1.wafer ? '완료 — 반출 대기' : '비어 있음'), 'pm1','vac'],
   ['PM2 Status', !S.pm2.run,
     S.pm2.run ? ('공정 중 — 남은 '+pmLeft('pm2').toFixed(0)+'초')
               : (S.pm2.wafer ? '완료 — 반출 대기' : '비어 있음'), 'pm2','vac']
  ];
  /* 4번째 칸부터는 그 줄이 속한 장치 키. 없으면 로봇 자체의 센서라 항상 보인다. */
  return rows.filter(x=>x.length<=3||inScope(...x.slice(3)));
}

    .map(t=>`<tr><th style="width:32%">${t[0]}</th><td>${t[1]}</td></tr>`).join('')}

/* 훈련 안내 — 무엇이 끝 조건인가 · 어느 탭에서 하는가 · 지금 자세는 어떤가 */
function drillClear(d){
  if(d.type==='tour')  return `제시되는 <b>목표 자세</b>를 ${d.n}번 연속으로 만들면 완료됩니다. 하나를 만들면 다음 목표가 곧바로 나옵니다.`;
  if(d.type==='route') return `위에 적힌 <b>${d.n}곳</b>을 모두 방문하면 완료됩니다. 도는 순서는 직접 정합니다.`;
  if(d.type==='codes') return `위에 적힌 알람 <b>${d.codes.join(' · ')}</b> 를 각각 한 번씩 일부러 띄우면 완료됩니다. 순서는 자유입니다.`;
  if(d.type==='goal')  return `위에 적힌 <b>${d.goals.length}개 조건</b>을 맨 위부터 차례로 만족시키면 완료됩니다. 순서를 건너뛰면 인정되지 않습니다.`;
  if(d.type==='value') return `<b>${d.qs.length}문항</b>에 모두 올바르게 답하면 완료됩니다. 답은 이 훈련 탭에서 고르거나 적습니다.`;
  if(d.type==='predict') return `<b>${d.rounds.length}문항</b> — 문항마다 "바뀔 신호"를 고르고 실행을 눌러 맞힙니다. 고른 집합이 실제와 정확히 같아야 정답입니다(빠뜨려도, 더 골라도 오답).`;
  if(d.type==='exam')  return `<b>1부 실기</b> — ${d.goals.length}개 단계를 맨 위부터 차례로 만족시킵니다.
    <b>2부 퀴즈</b> — 4지선다 ${Math.min(d.quizN||d.quiz.length,d.quiz.length)}문항(문항 은행 ${d.quiz.length}개 중 매번 무작위 · 보기 순서도 섞임), 고르면 바로 정답과 해설이 나옵니다.
    끝나면 실기 시간 · 알람 수 · 퀴즈 점수 · 총 소요 시간이 기록됩니다.`;
  return '';
}
function drillFails(d){
  const a=[];
  if(d.limitSec)             a.push(`제한 시간 <b>${d.limitSec}초</b>를 넘기면 실패`);
  if(d.actLimitSec)          a.push(`실기 제한 시간 <b>${d.actLimitSec}초</b> — 넘기면 "시간 초과"로 기록되고 퀴즈로 넘어갑니다`);
  if(DR.opsAllow)            a.push(`조작 <b>${DR.opsAllow}회</b>를 넘기면 실패`+
                                    (DR.minOps?` (최단 ${DR.minOps} ＋ 준비 ${PREP_OPS} ＋ 여유 ${d.slack})`:''));
  if(d.maxAlarm!==undefined) a.push(`알람 <b>${d.maxAlarm}회</b>까지만 허용 — 현재 ${C.alarm-DR.alarm0}회`);
  if(d.maxWrong!==undefined) a.push(`오답 <b>${d.maxWrong}회</b>까지만 허용 — 현재 ${DR.wrong}회`);
  if(d.onlyCodes)            a.push(`지정한 알람 <b>외의 알람</b>이 한 번이라도 나면 실패 (Initialize·Home 을 빠뜨린 101·102 도 포함)`);
  if(d.type==='predict')     a.push(`훈련 중 <b>수동 조작</b>을 하면 실패 — 버튼은 훈련이 대신 누릅니다`);
  return a;
}
function drillTabs(d){
  const avail=WEEK[WK].tabs;
  return (d.use||['manual']).filter(k=>k!=='drill'&&avail.includes(k));
}
const SHORT={'FOUP':'FOUP','Pre-aligner':'Aligner','Load Lock':'Load Lock'};
const stShort=i=>SHORT[ST.efem[i].n]||ST.efem[i].n;
function poseText(r){
  return ST.efem[r.si].n+' · Z '+r.z+' · 팔 '+(extended(r)?'전진':'수축');
}

/* 지금 자세에서 목표 자세까지 "어느 버튼을 몇 번" 누르면 되는지.
   목표만 적어 두면 학생이 방향을 못 잡는다 — 회전은 세 스테이션이 원형이라
   반대로 도는 쪽이 짧을 때가 있고, Z 는 Down 이 슬롯 번호를 늘린다. */
function movesTo(r, t){
  const out=[];
  if(extended(r)) out.push(['ret','Retract', 1]);      // 뻗은 채로는 회전·Z 가 막힌다
  const n=ST.efem.length, f=((t.st-r.si)%n+n)%n;
  if(f) (f<=n-f) ? out.push(['rotR','Rotate ▶', f]) : out.push(['rotL','◀ Rotate', n-f]);
  const dz=t.z-r.z;
  if(dz>0) out.push(['dn','▼ Z Down', dz]);
  else if(dz<0) out.push(['up','▲ Z Up', -dz]);
  return out;
}
function movesText(r, t){
  const m=movesTo(r,t);
  if(!m.length) return null;
  return m.map(x=>`<b>${x[1]}</b> ${x[2]}회`).join(' · ');
}
/* 남은 조작 상자. 자세가 바뀔 때마다 liveUpdate 가 같은 함수로 갈아끼운다. */
function movBox(t){
  const m=movesText(S.efem, t);
  return m ? `<div class="dmov"><span class="ml">남은 조작</span>${m}
      <i>수동조작 탭에서 누르세요</i></div>`
    : `<div class="dmov ok"><span class="ml">자세 완성</span><b>곧 다음 목표가 나옵니다</b></div>`;
}

/* 수행평가 진행 화면 — 1부는 실기 단계 목록, 2부는 퀴즈 한 문항씩 (고르면 바로 채점) */
function examProg(){
  const d=DR.d, ex=DR.ex;
  return ex.phase==='act' ? ('실기 '+DR.idx+' / '+d.goals.length) : ('퀴즈 '+DR.qi+' / '+ex.qs.length);
}
function examBody(d){
  const ex=DR.ex;
  if(ex.phase==='act'){
    return d.goals.map((g,i)=>`<div class="ms ${i<DR.idx?'done':''} ${i===DR.idx?'at':''}">
        <span class="cb">✓</span><span>${g.t()}</span></div>`).join('');
  }
  const it=ex.qs[DR.qi]; if(!it) return '';
  const q=it.q, perm=it.perm, L='ABCD';
  const answered=ex.pick!==null, last=DR.qi>=ex.qs.length-1;
  return `<div class="dsub" style="margin-bottom:8px">실기 — ${ex.actOk?'<b style="color:var(--ok)">통과</b> '+fmtSec(ex.actSec):'<b style="color:var(--warn)">시간 초과</b>'} · 알람 ${ex.actAlarm}회</div>
    <div class="qz">
      <div class="qq">Q${DR.qi+1}. ${q.q}</div>
      ${perm.map((j,k)=>{
        const st=!answered?'':(j===q.c?'ok':(j===ex.pick?'no':''));
        return `<button class="qa ${st}" data-a="drEx:${j}" ${answered?'disabled':''}>${L[k]}. ${q.a[j]}</button>`;}).join('')}
      ${answered?`<div class="qe"><b style="color:${ex.pick===q.c?'var(--ok)':'#ff9a9a'}">${ex.pick===q.c?'정답입니다.':'오답입니다. 정답은 '+L[perm.indexOf(q.c)]+'.'}</b> ${q.e}</div>`:''}
    </div>
    ${answered?`<button class="btn k on" data-a="drExNext" style="width:100%">${last?'결과 보기':'다음 문항 →'}</button>`:''}`;
}

          :d.type==='exam'?examProg():(DR.idx+' / '+d.n)}</b></span>

    </div>`;
  }
  const cards=list.map(x=>{
    const done=DR.done[x.id], best=DR.best[x.id];
    const rec = best===undefined?'':(x.record==='time'?` · 최고 ${x.type==='exam'?fmtSec(best):best+'초'}`:` · 최소 ${best}회`);
    const last = x.type==='exam'&&DR.exLast[x.id] ? DR.exLast[x.id] : null;
    return `<div class="dcard ${done?'done':''}">

        style="width:100%;margin-top:8px">${done?'다시 하기':'시작'}</button>
    </div>`;}).join('');
  const fin=list.every(x=>DR.done[x.id]);
  return `<h4 class="sec">훈련</h4>

  <div class="hint">훈련은 <b>제어 대상이 EFEM Robot일 때</b>만 판정됩니다.</div>`;
}

function predBody(d){

  if(pr.phase==='ask') return `${rd.preMsg?`<div class="dsub" style="color:var(--run)">${rd.preMsg}</div>`:''}${now}

/* [키, 이름, 현상 설명, 채점 키워드]
   pump 와 leak 은 증상이 겹친다 — 배기를 멈추고 압력이 오르는지 보아야 갈린다.
   wps · grip · teach 도 "Pick 주변에서 웨이퍼가 안 잡힌다" 로 겹친다. */
const FAULTS=[
 ['pump','펌프 성능 저하','배기가 목표 압력에 닿지 못한다',
  {sensor:['압력','pressure','진공','vacuum','torr'], log:['701','timeout','타임아웃','배기']}],
 ['leak','진공 누설','배기가 목표에 닿지 못하고, 멈추면 압력이 스스로 오른다',
  {sensor:['압력','pressure','진공','vacuum','torr'], log:['701','timeout','타임아웃','배기']}],
 ['map','매핑 신호 불일치','매핑 결과와 실제 슬롯 상태가 다르다',
  {sensor:['매핑','mapping','슬롯','slot'], log:['map','매핑','불일치']}],
 ['wps','Wafer Presence 센서 불량','웨이퍼가 있는데도 Pick 이 완료되지 않는다',
  {sensor:['presence','프레즌스','감지','wafer'], log:['503','pick','픽']}],
 ['grip','End Effector 흡착 불량','집기는 되지만 이송 중 웨이퍼를 놓친다',
  {sensor:['presence','감지','wafer','웨이퍼'], log:['506','낙하','사라','이송','lost']}],
 ['enc','Encoder θ 편차','회전 후 위치가 목표 각도와 어긋난다',
  {sensor:['position','위치','encoder','엔코더','편차','각'], log:['405','편차','position','위치']}],
 ['teach','Z축 티칭 틀어짐','겨냥한 칸과 실제로 손이 닿는 칸이 다르다',
  {sensor:['슬롯','slot','매핑','mapping','presence','감지','z'], log:['502','pick','픽','슬롯']}]
];
const FKEY=k=>FAULTS.find(f=>f[0]===k);
/* 고장을 넣을 때마다 세부 값을 새로 뽑는다 — 두 번째부터는 답을 외울 수 없게 */
function faultRoll(k){
  if(k==='map')   S.fault.mapSlot=Math.floor(Math.random()*5);
  if(k==='teach') S.fault.teachOff=Math.random()<0.5?-1:1;
  if(k==='enc')   S.fault.encDev=(Math.random()<0.5?-1:1)*(5+Math.floor(Math.random()*8));
}
/* 진단 훈련용 — 어떤 고장인지 로그에 남기지 않고 넣는다 */
function faultInject(k){
  S.fault[k]=true; faultRoll(k); C.flt++;
  return k;
}
function faultClearAll(){
  ['pump','leak','map','wps','grip','enc','teach'].forEach(k=>{ S.fault[k]=false; });
}
const faultActive=()=>['pump','leak','map','wps','grip','enc','teach'].filter(k=>S.fault[k]);
/* 진단 보고서 채점 — 서술을 이해하는 게 아니라 "요소를 짚었는가" 만 본다.
   원인만 선택지로 엄격히 채점하고, 나머지는 키워드가 하나라도 들어갔는지 본다. */
const RPT_GEN={
  Problem:['배기','압력','pick','픽','매핑','웨이퍼','회전','위치','낙하','알람','진공','슬롯','정지','실패','이상','안 ','못'],
  'Corrective Action':['교체','점검','정비','보정','티칭','조정','청소','reset','리셋','재시작','수리','재교육','확인','조치'],
  Result:['정상','복구','해결','재현','통과','확인','완료','회복','성공']
};
const RPT_FIELDS=['Problem','Observed Sensor','Observed Log','Possible Cause','Corrective Action','Result'];
let RPT_SCORE=null;          // {cause:bool, got:{필드:bool}, n:점수, of:만점, target:'키'}

function rptGrade(){
  const act=faultActive();
  if(!act.length){ toast('먼저 고장을 주입하고 관찰하세요',false); return; }
  const hit=(txt,keys)=>{ const t=String(txt||'').toLowerCase();
    return keys.some(k=>t.includes(String(k).toLowerCase())); };

  /* 원인은 주입된 고장 중 하나를 고르면 정답 */
  const causeOK = !!RPT.causeKey && act.includes(RPT.causeKey);
  /* 센서·로그 키워드는 학생이 고른 원인이 아니라 실제 고장 기준으로 본다 */
  const kw = FKEY(act[0])[3];
  const got={
    Problem:            hit(RPT.Problem, RPT_GEN.Problem),
    'Observed Sensor':  hit(RPT['Observed Sensor'], kw.sensor),
    'Observed Log':     hit(RPT['Observed Log'], kw.log),
    'Corrective Action':hit(RPT['Corrective Action'], RPT_GEN['Corrective Action']),
    Result:             hit(RPT.Result, RPT_GEN.Result)
  };
  const n=Object.values(got).filter(Boolean).length;
  RPT_SCORE={cause:causeOK, got:got, n:n, of:5, target:act[0]};
  RPT_DONE = causeOK && n>=4;
  log(RPT_DONE?'S':'W','REPORT',
    '보고서 채점 — 원인 '+(causeOK?'정답':'오답')+' · 요소 '+n+'/5'+(RPT_DONE?' · 합격':' · 미달'));
  if(RPT_DONE) ok('보고서 합격 — 원인 정답 · 요소 '+n+'/5');
  else toast('원인 정답과 요소 4개 이상이 필요합니다 (지금 '+n+'/5)',false);
}

    <button class="btn k on" data-a="rptGrade">채점</button>

  ${RPT_SCORE?`<div class="nowb" style="border-color:${RPT_DONE?'var(--ok)':'var(--warn)'};margin-top:8px">

    ${RPT_DONE?'· 합격':'· 미달 (원인 정답 + 요소 4개 이상)'}</b>
    <em>서술을 읽어 판단하는 것이 아니라 <b>핵심 요소가 들어갔는지</b>만 봅니다.
      센서 칸에는 관찰한 센서 이름을, 로그 칸에는 알람 코드를 적으세요.</em></div>`:''}
  <div class="hint">진단 순서: <b>현상 → 센서 → 로그 → 원인 → 조치 → 확인</b>. 이 순서가 실제 장비 엔지니어의 작업 순서입니다.
    <b>원인이 하나로 좁혀지지 않을 때는 실험을 하나 더 하세요</b> — 예를 들어 배기를 멈추고 압력이 오르는지 봅니다.</div>`;
}

function renderSeq(){
  const el=$('#seqList'); if(!el)return;
  el.innerHTML=SEQ.length?SEQ.map((s,i)=>
    `<div class="sq ${s.st||''}" data-i="${i}"><span class="n">${String(i+1).padStart(2,'0')}</span><span>${s.c}</span><button class="x" data-a="seqDel:${i}">✕</button></div>`).join('')
